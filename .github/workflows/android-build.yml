name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'app/android-native-wms/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        working-directory: app/android-native-wms
        run: chmod +x gradlew

      - name: Remove sandbox proxy settings
        working-directory: app/android-native-wms
        run: |
          sed -i '/systemProp.http.proxyHost/d' gradle.properties
          sed -i '/systemProp.http.proxyPort/d' gradle.properties
          sed -i '/systemProp.https.proxyHost/d' gradle.properties
          sed -i '/systemProp.https.proxyPort/d' gradle.properties
          sed -i '/# Proxy settings/d' gradle.properties

      - name: Build Debug APK
        working-directory: app/android-native-wms
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/android-native-wms/app/build/outputs/apk/debug/app-debug.apk