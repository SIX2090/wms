name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        working-directory: app/android-native-wms
        run: chmod +x gradlew

      - name: Remove sandbox proxy settings
        working-directory: app/android-native-wms
        run: |
          sed -i '/systemProp.http.proxyHost/d' gradle.properties
          sed -i '/systemProp.http.proxyPort/d' gradle.properties
          sed -i '/systemProp.https.proxyHost/d' gradle.properties
          sed -i '/systemProp.https.proxyPort/d' gradle.properties
          sed -i '/# Proxy settings/d' gradle.properties

      # AI-MOB-VOICE-F01-fix3（2026-08-26）：默认构建开启 sherpa-onnx 离线语音识别。
      # 下载中文流式模型到 assets（随 APK 打包）+ 下载 AAR 到 app/libs/（本地文件依赖，
      # sherpa-onnx 的 AAR 只发 GitHub Releases 不在 Maven Central）。
      # 手机装上后无需腾讯云密钥、无需联网即可用语音指令（引擎链：云 → sherpa → 系统）。
      - name: Download sherpa-onnx model & AAR (离线语音)
        working-directory: app/android-native-wms
        run: ./gradlew :app:downloadSherpaModel :app:downloadSherpaAar -Pwms.sherpa=true --no-daemon --stacktrace

      # downloadSherpa* 失败只 warn 不 fail（Gradle task 设计如此），
      # CI 必须显式校验模型文件与 AAR 齐全，否则打出的 APK 静默缺语音/缺依赖。
      - name: Verify sherpa model & AAR present
        run: |
          dir=app/android-native-wms/app/src/main/assets/sherpa-onnx/stream
          for f in tokens.txt encoder.onnx decoder.onnx joiner.onnx; do
            [ -f "$dir/$f" ] || { echo "::error::missing $dir/$f"; exit 1; }
          done
          aar=app/android-native-wms/app/libs/sherpa-onnx-1.13.6.aar
          [ -f "$aar" ] || { echo "::error::missing $aar"; exit 1; }
          du -sh "$dir" "$aar"

      # 方案A：用 assembleDebug 做编译验证（Debug 无需签名，避免 release keystore 缺失导致
      # 构建在签名配置阶段即失败，从而真正走到 Kotlin 编译，暴露语法/依赖问题）。
      # -Pwms.sherpa=true：引入 sherpa-onnx AAR 并打包上一步下载的模型。
      - name: Build Debug APK
        working-directory: app/android-native-wms
        run: ./gradlew assembleDebug -Pwms.sherpa=true --no-daemon --stacktrace

      # BUG-2026-08-16-021：Android CI 仅 assembleDebug 无 lint/单测，补 lint+test 门禁。
      # lintDebug 检查静态问题（无用资源/API 误用/可访问性等），testDebugUnitTest 跑 JVM 单测。
      # 同样带 -Pwms.sherpa=true，保证 lint/单测与产物的构建配置一致。
      - name: Lint (BUG-2026-08-16-021)
        working-directory: app/android-native-wms
        run: ./gradlew lintDebug -Pwms.sherpa=true --no-daemon --stacktrace

      - name: Unit tests (BUG-2026-08-16-021)
        working-directory: app/android-native-wms
        run: ./gradlew testDebugUnitTest -Pwms.sherpa=true --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/android-native-wms/app/build/outputs/apk/debug/app-debug.apk