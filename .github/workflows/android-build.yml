name: Android APK Build

on:
  push:
    branches: [main]
    paths:
      - 'app/android-native-wms/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Grant execute permission for gradlew
        working-directory: app/android-native-wms
        run: chmod +x gradlew

      - name: Remove sandbox proxy settings
        working-directory: app/android-native-wms
        run: |
          sed -i '/systemProp.http.proxyHost/d' gradle.properties
          sed -i '/systemProp.http.proxyPort/d' gradle.properties
          sed -i '/systemProp.https.proxyHost/d' gradle.properties
          sed -i '/systemProp.https.proxyPort/d' gradle.properties
          sed -i '/# Proxy settings/d' gradle.properties

      - name: Build Release APK
        working-directory: app/android-native-wms
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/android-native-wms/app/build/outputs/apk/release/app-release.apk

      # 回传 release APK 到仓库根目录：服务器通过 git pull 即可拿到，
      # 无需手动下载。仅提交根目录 app-release.apk，不触碰 android-native-wms/**，
      # 因此不会再次触发本 workflow（死循环），只会触发 verify/ci 的 Python 测试。
      - name: Commit APK back to repo
        run: |
          cp app/android-native-wms/app/build/outputs/apk/release/app-release.apk ./app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-release.apk
          if git diff --cached --quiet; then
            echo "APK unchanged, nothing to commit"
          else
            git commit -m "chore(mobile): update release APK [skip ci]"
            git push
          fi