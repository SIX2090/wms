name: WMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # CI-GREEN-GATE-2026-09-18：每日定时跑一次（AGENTS.md §三 CI 全绿门禁）。
  # UTC 18:30 = 北京时间 02:30，与 Android APK Build / WMS AI Verification
  # 同一时刻并行触发。cron 只对默认分支 main 生效，与本门禁的目标分支一致。
  schedule:
    - cron: '30 18 * * *'

# CI-PERF-2026-09-17：原单一 job 串行 20 分钟，其中 93% 花在两处：
#   - "Unit tests + coverage"       526s（含 3.6 分钟纯覆盖率测量开销）
#   - "Verify regression"           583s（173 个文件逐进程，启动开销占 8.6 分钟）
# 现改为**三个互不依赖的并行 job**，并把每个 job 内部也并行化：
#   lint-and-static    ~40s  静态门禁（lint×2 + verify_wms_bugs + gitleaks）
#   unit-tests        ~150s  主套件（pytest-xdist -n 4，已去白跑的覆盖率统计）
#   verify-and-smoke  ~260s  verify 分流 + 冒烟测试（verify 改并发调度，隔离模型不变）
# 总时长由最慢的 verify-and-smoke 决定。三项原本就是独立校验，拆开**不减少任何
# 校验项**，只是让互不依赖的工作真正并行 —— 任一 job 失败都会独立亮红，不会漏报。
jobs:
  # ==========================================================================
  # Job 1：静态门禁（快，约 40s，作为最快的反馈信号）
  # ==========================================================================
  lint-and-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI-ENV-2026-09-11：pytest 等测试依赖改为钉版清单，杜绝"CI 拉最新
          # pytest 与钉死的 pytest-cov 版本漂移"这类环境性失败
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # Lint: 防 BUG 7 条规则 (A1-A7),任何一条不过都视为 BUG 风险
      - name: "Lint - 防 BUG 7 条规则"
        run: python3 scripts/lint_wms_rules.py

      # A11 全量硬门禁（2026-09-20）：A11 默认只在 pre-commit 查 staged 新增行，
      # CI checkout 无 staged 文件，不加本步则 A11 在 CI 形同虚设。
      # P0-1 存量违规已清零（豁免注释见 stock-truth:reason=），全量扫描应保持 0 违规。
      - name: "Lint - A11 库存校验口径全量扫描"
        run: python3 scripts/lint_wms_rules.py --rule a11 --full-a11

      # Lint: 禁止裸调非 GET fetch (防 CSRF 漏写)
      - name: "Lint - 禁止裸调非 GET fetch"
        run: python3 scripts/lint_no_raw_post_fetch.py

      # 静态回归: 历史 BUG 不再以违规形式存在
      # 86/86 PASS,改成必过 (continue-on-error: false / 移除 continue-on-error 行)
      - name: "Static regression - verify_wms_bugs"
        run: python3 scripts/verify_wms_bugs.py

      # BUG-2026-08-16-018：密钥泄露扫描（gitleaks）。
      # continue-on-error 起步：先产出报告，后续收紧为门禁。
      - name: "Security scan - gitleaks (BUG-2026-08-16-018)"
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # BUG-2026-08-16-018：依赖漏洞扫描（pip-audit）。
      # BUG-2026-08-24-001：按"先可见、人工判真后收紧"既定意图，已完成依赖升级
      # （requirements.txt 全部钉包经 OSV 复核清零、全量依赖闭包 pip-audit 0 漏洞），
      # 本步骤收紧为阻塞门禁：任何引入已知漏洞的依赖变更将使 CI 失败。
      # 若未来出现无修复版本的漏洞，需显式加 --ignore-vuln <ID> 并注明理由，不得整体退回 advisory。
      #
      # CI-PERF-2026-09-17：本步骤从原单一 job 迁到静态门禁 job —— 它只读
      # requirements.txt、与测试执行无关，且实测仅 13s，放在任一 job 均可；
      # 归入静态门禁后它与 lint 同处一条快速反馈通道，不占关键路径。
      # 注意：**阻塞门禁属性不变**（无 continue-on-error）。
      - name: "Security scan - pip-audit (BUG-2026-08-16-018 阻塞门禁)"
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r app/requirements.txt

      # 验证 install-hooks.sh 的可重现性（仅作可达性证明，CI 本身不强制）
      - name: "Check hooks install script reproducibility"
        continue-on-error: true
        run: |
          bash .githooks/install-hooks.sh
          python3 scripts/check_hooks_installed.py

      - name: "CI summary"
        if: always()
        run: |
          echo "::notice::WMS CI (lint-and-static) 完成"
          echo "详细日志请查看上方各 step 输出"

  # ==========================================================================
  # Job 2a-2c：主单元测试套件（CI-PERF-2026-09-24 起按片并行）
  # ==========================================================================
  # 原单 job 跑全量 362 个 test_*.py（实测 ~180s），在 verify 切成 4 片后
  # 它成了**新的关键路径**（WMS CI #1230 实测：verify 各片 65–88s、
  # lint 70s、smoke 33s，而 unit-tests 一步就是 180s）。
  #
  # 为什么切片有效、而 `-n 16` 无效（实测数据，非推测）：
  #   本机 32 核上 `-n 4` = 123s、`-n 16` = 143s（**反而更慢**）→ 套件不是
  #   CPU 密集，而是 IO 密集（每个测试自己 import app + 建库，2–4s 级）；
  #   单机加并发只会加剧 IO 争抢。但切成多片后每片独占**一台独立 runner**
  #   （4 核 VM，互不抢 IO），关键路径变成「全量时间/片数 + 启动开销」。
  #   实测 1 片（121 文件）= 43.2s / 839 passed，3 片并行预计 ~75s。
  #
  # 分片规则与 scripts/run_verify_parallel.py 同款：按 sorted() 序号取模
  # （`i % shards == shard`），每片均匀混入长短耗时文件，避免某片全是慢文件。
  # 362 文件 → 121+121+120，不重不漏（离线验算）。
  #
  # pytest 参数与原 job **完全一致**（-q -p no:pylama -n 4 --dist loadfile），
  # 切片只改变"喂给 pytest 的文件集合"，不改变执行方式与隔离模型。
  # 任一 shard 失败独立亮红（A12：只加强不削弱）。
  unit-tests-shard-0:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # 单元测试（BUG-2026-08-16-018 / CI-PERF-2026-09-17 / CI-PERF-2026-09-24）
      #
      # 已去掉 --cov=app --cov-report=* --cov-fail-under=0：
      #   1) `--cov-fail-under=0` 意味着它**不拦任何门槛**，产出的 coverage.xml
      #      在本 workflow 里也没有任何上传/发布动作，属纯白跑；
      #   2) 实测覆盖率测量开销占整个主套件的约 70%（526s → 310s）；
      #   3) 修复类提交在本地都已有等价的测试证据，覆盖率报告不是它们的判据。
      # 若将来要恢复覆盖率门禁，应拆成独立 job 并把 fail-under 设成真实阈值，
      # 而不是以 fail-under=0 的形式挂在主套件的关键路径上。
      #
      # -n 4 --dist loadfile：按**文件**分发到各 worker，文件内部仍串行执行。
      # 这样既拿到并行收益，又不改变文件内的执行顺序（历史那批测试间状态污染
      # 是"文件之间互相污染"，loadfile 保持文件边界，实测与串行零差异）。
      - name: "Unit tests - shard 0/3 (pytest-xdist -n 4 --dist loadfile)"
        env:
          VERIFY_TEST_SHARDS: '3'
          VERIFY_TEST_SHARD: '0'
          VERIFY_TEST_WORKERS: '4'
        run: python3 scripts/run_tests_sharded.py

  unit-tests-shard-1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Unit tests - shard 1/3 (pytest-xdist -n 4 --dist loadfile)"
        env:
          VERIFY_TEST_SHARDS: '3'
          VERIFY_TEST_SHARD: '1'
          VERIFY_TEST_WORKERS: '4'
        run: python3 scripts/run_tests_sharded.py

  unit-tests-shard-2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Unit tests - shard 2/3 (pytest-xdist -n 4 --dist loadfile)"
        env:
          VERIFY_TEST_SHARDS: '3'
          VERIFY_TEST_SHARD: '2'
          VERIFY_TEST_WORKERS: '4'
        run: python3 scripts/run_tests_sharded.py

  # ==========================================================================
  # Job 3a-3d：verify 契约回归（178 个文件，CI-PERF-2026-09-24 起按片并行）
  # ==========================================================================
  # 原为单个 verify-and-smoke job 串行跑全部 178 个文件（~190s，为关键路径）。
  # 现按**文件序号取模**切成 4 片，4 个 job 并行 —— 每片仍是"逐文件独立进程 +
  # 片内 4 并发"的隔离模型（见 scripts/run_verify_parallel.py 的说明），
  # **不重不漏**（每文件恰好落进一片，已离线验算 178 = 45+45+44+44）。
  #
  # 为什么用取模而不是连续区间：每片都均匀混入耗时长短不一的文件，避免某片
  # 恰好全是慢文件而成为新的关键路径。
  #
  # 任一 shard 失败独立亮红，门禁语义不变（AGENTS.md §六 A12：只加强不削弱）。
  # 冒烟测试拆到独立 job（smoke），与 verify 并行，不再串在 verify 后面。
  verify-shard-0:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Verify regression - shard 0/4 (BUG-2026-08-16-017)"
        timeout-minutes: 20
        env:
          VERIFY_WORKERS: '4'
          VERIFY_SHARDS: '4'
          VERIFY_SHARD: '0'
        run: python3 scripts/run_verify_parallel.py

      - name: "Upload verify failure summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failures-shard-0
          path: verify_failures_summary.md
          if-no-files-found: ignore
          retention-days: 7

  verify-shard-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Verify regression - shard 1/4 (BUG-2026-08-16-017)"
        timeout-minutes: 20
        env:
          VERIFY_WORKERS: '4'
          VERIFY_SHARDS: '4'
          VERIFY_SHARD: '1'
        run: python3 scripts/run_verify_parallel.py

      - name: "Upload verify failure summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failures-shard-1
          path: verify_failures_summary.md
          if-no-files-found: ignore
          retention-days: 7

  verify-shard-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Verify regression - shard 2/4 (BUG-2026-08-16-017)"
        timeout-minutes: 20
        env:
          VERIFY_WORKERS: '4'
          VERIFY_SHARDS: '4'
          VERIFY_SHARD: '2'
        run: python3 scripts/run_verify_parallel.py

      - name: "Upload verify failure summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failures-shard-2
          path: verify_failures_summary.md
          if-no-files-found: ignore
          retention-days: 7

  verify-shard-3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      - name: "Verify regression - shard 3/4 (BUG-2026-08-16-017)"
        timeout-minutes: 20
        env:
          VERIFY_WORKERS: '4'
          VERIFY_SHARDS: '4'
          VERIFY_SHARD: '3'
        run: python3 scripts/run_verify_parallel.py

      - name: "Upload verify failure summary"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-failures-shard-3
          path: verify_failures_summary.md
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # Job 4：冒烟测试（与 verify 各片并行，CI-PERF-2026-09-24 起独立）
  # ==========================================================================
  # 原串在 verify 之后（verify 跑完才启服务），现已无数据依赖，拆开并行。
  smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # 冒烟测试：启动 WMS 服务跑 121 项全量冒烟
      - name: "Smoke test (启动服务跑 121 项)"
        run: python3 scripts/run_smoke_in_ci.py

      # CI summary
      - name: "CI summary"
        if: always()
        run: |
          echo "::notice::WMS CI (smoke) 完成"
          echo "详细日志请查看上方各 step 输出"
