name: WMS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI-PERF-2026-09-17：原单一 job 串行 20 分钟，其中 93% 花在两处：
#   - "Unit tests + coverage"       526s（含 3.6 分钟纯覆盖率测量开销）
#   - "Verify regression"           583s（173 个文件逐进程，启动开销占 8.6 分钟）
# 现改为**三个互不依赖的并行 job**，并把每个 job 内部也并行化：
#   lint-and-static    ~40s  静态门禁（lint×2 + verify_wms_bugs + gitleaks）
#   unit-tests        ~150s  主套件（pytest-xdist -n 4，已去白跑的覆盖率统计）
#   verify-and-smoke  ~260s  verify 分流 + 冒烟测试（verify 改并发调度，隔离模型不变）
# 总时长由最慢的 verify-and-smoke 决定。三项原本就是独立校验，拆开**不减少任何
# 校验项**，只是让互不依赖的工作真正并行 —— 任一 job 失败都会独立亮红，不会漏报。
jobs:
  # ==========================================================================
  # Job 1：静态门禁（快，约 40s，作为最快的反馈信号）
  # ==========================================================================
  lint-and-static:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CI-ENV-2026-09-11：pytest 等测试依赖改为钉版清单，杜绝"CI 拉最新
          # pytest 与钉死的 pytest-cov 版本漂移"这类环境性失败
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # Lint: 防 BUG 7 条规则 (A1-A7),任何一条不过都视为 BUG 风险
      - name: "Lint - 防 BUG 7 条规则"
        run: python3 scripts/lint_wms_rules.py

      # Lint: 禁止裸调非 GET fetch (防 CSRF 漏写)
      - name: "Lint - 禁止裸调非 GET fetch"
        run: python3 scripts/lint_no_raw_post_fetch.py

      # 静态回归: 历史 BUG 不再以违规形式存在
      # 86/86 PASS,改成必过 (continue-on-error: false / 移除 continue-on-error 行)
      - name: "Static regression - verify_wms_bugs"
        run: python3 scripts/verify_wms_bugs.py

      # BUG-2026-08-16-018：密钥泄露扫描（gitleaks）。
      # continue-on-error 起步：先产出报告，后续收紧为门禁。
      - name: "Security scan - gitleaks (BUG-2026-08-16-018)"
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # BUG-2026-08-16-018：依赖漏洞扫描（pip-audit）。
      # BUG-2026-08-24-001：按"先可见、人工判真后收紧"既定意图，已完成依赖升级
      # （requirements.txt 全部钉包经 OSV 复核清零、全量依赖闭包 pip-audit 0 漏洞），
      # 本步骤收紧为阻塞门禁：任何引入已知漏洞的依赖变更将使 CI 失败。
      # 若未来出现无修复版本的漏洞，需显式加 --ignore-vuln <ID> 并注明理由，不得整体退回 advisory。
      #
      # CI-PERF-2026-09-17：本步骤从原单一 job 迁到静态门禁 job —— 它只读
      # requirements.txt、与测试执行无关，且实测仅 13s，放在任一 job 均可；
      # 归入静态门禁后它与 lint 同处一条快速反馈通道，不占关键路径。
      # 注意：**阻塞门禁属性不变**（无 continue-on-error）。
      - name: "Security scan - pip-audit (BUG-2026-08-16-018 阻塞门禁)"
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r app/requirements.txt

      # 验证 install-hooks.sh 的可重现性（仅作可达性证明，CI 本身不强制）
      - name: "Check hooks install script reproducibility"
        continue-on-error: true
        run: |
          bash .githooks/install-hooks.sh
          python3 scripts/check_hooks_installed.py

      - name: "CI summary"
        if: always()
        run: |
          echo "::notice::WMS CI (lint-and-static) 完成"
          echo "详细日志请查看上方各 step 输出"

  # ==========================================================================
  # Job 2：主单元测试套件（约 150s）
  # ==========================================================================
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # 单元测试（BUG-2026-08-16-018 / CI-PERF-2026-09-17）
      #
      # 已去掉 --cov=app --cov-report=* --cov-fail-under=0：
      #   1) `--cov-fail-under=0` 意味着它**不拦任何门槛**，产出的 coverage.xml
      #      在本 workflow 里也没有任何上传/发布动作，属纯白跑；
      #   2) 实测覆盖率测量开销占整个主套件的约 70%（526s → 310s）；
      #   3) 修复类提交在本地都已有等价的测试证据，覆盖率报告不是它们的判据。
      # 若将来要恢复覆盖率门禁，应拆成独立 job 并把 fail-under 设成真实阈值，
      # 而不是以 fail-under=0 的形式挂在主套件的关键路径上。
      #
      # -n 4 --dist loadfile：按**文件**分发到各 worker，文件内部仍串行执行。
      # 这样既拿到并行收益，又不改变文件内的执行顺序（历史那批测试间状态污染
      # 是"文件之间互相污染"，loadfile 保持文件边界，实测 1998 passed / 85 skipped
      # 与串行完全一致、零差异）。
      - name: "Unit tests (pytest-xdist -n 4 --dist loadfile)"
        run: >
          pytest tests/ -q -p no:pylama
          -n 4 --dist loadfile

  # ==========================================================================
  # Job 3：verify 契约回归 + 冒烟测试（约 260s，为关键路径）
  # ==========================================================================
  verify-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # BUG-2026-08-16-017：tests/verify_*.py 回归脚本纳入 CI。
      # CI-PERF-2026-09-17：改为 scripts/run_verify_parallel.py 并发调度。
      #
      # **隔离模型完全没变**：仍是每个 verify 文件一个独立 python 进程、不共享内存，
      # 只是把"一个跑完再跑下一个"的串行等待换成进程池并发等待。
      # 为什么不能合并进单进程 / 交给 xdist 共享 worker（实测复现，非推测）：
      #   - 合并单进程：`no such table: warehouse`（前文件 db.drop_all 拆了内存库，
      #     后文件 import 期即查表），随后 172 个路径拼成超长命令行直接 file not found；
      #   - 交给 xdist：同一异常在**收集阶段**就把整批带崩，`no tests ran`；
      #   - `--forked`：隔离正确，但子进程仍需重新 import app，实测无净收益。
      # 历史同结论：当年多文件同进程混跑产生 169 例环境性假失败，故改为逐文件独立进程。
      # 脚本内保留原 step 的全部语义：pytest式/脚本式分流、known_failures 清单、
      # 单文件 60s 超时、失败文件数汇总 + 非零退出。
      - name: "Verify regression - verify_*.py (BUG-2026-08-16-017)"
        timeout-minutes: 20
        run: python3 scripts/run_verify_parallel.py

      # 冒烟测试：启动 WMS 服务跑 121 项全量冒烟
      - name: "Smoke test (启动服务跑 121 项)"
        run: python3 scripts/run_smoke_in_ci.py

      # CI summary
      - name: "CI summary"
        if: always()
        run: |
          echo "::notice::WMS CI (verify-and-smoke) 完成"
          echo "详细日志请查看上方各 step 输出"
