name: WMS Perf Baseline

# P2-1：业务接口压测基线（阈值告警而非硬门禁）。
# 每次 push 对 10 个最高频业务 GET 接口做低压并发压测，与仓库内
# scripts/perf_baseline.json 基线对比：p95 回归 >50% 且 >50ms 打 ::warning::
# 注解，但**不改变工作流成败**（continue-on-error: true 兜底装置性失败，
# 脚本自身在回归时也恒退出 0，只有 --strict 才会非零）。
#
# 为什么不进 WMS CI 主工作流：压测要给 waitress 起真实服务并跑 ~30s 测量，
# 放主套件会拉长关键路径；且它的语义是"观测回归"而非"拦截合并"。
# 每日定时跑一次（UTC 18:45，错开 18:30 的三个门禁工作流），保证
# 即使当天没人推代码，也能发现依赖变更导致的性能漂移。

# CI-RUNNER-2026-09-26：runs-on 钉 ubuntu-24.04（防 2026-10-19 起 ubuntu-latest
# 自动切 Ubuntu 26 的环境漂移，理由同 ci.yml 头部注释）；upload-artifact v4→v7
# （v4 为 Node 20 线，已被 GitHub 强制 Node 24，v7 参数兼容）。

# F3.16：连续推送只保留最新 run——同一分支的旧 run 自动取消，
# 避免排队积压与资源浪费（审计 §3.8）。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '45 18 * * *'

jobs:
  # BUG-2026-10-22-016: unknown changes and non-push events keep full validation.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      mode: ${{ steps.scope.outputs.mode }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Checkout full history for trusted comparison
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup classifier Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Classify changes with exact successful base verification
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_change_scope.py --event-file "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"

  perf:
    needs: changes
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' || needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    # 阈值告警而非硬门禁（P2-1 验收口径）：装置性失败/回归不使本工作流变红，
    # 回归以 ::warning:: 注解形式出现在 summary 与文件 diff 上。
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements-test.txt

      - name: Create required directories
        run: |
          mkdir -p app/logs app/instance app/uploads logs

      # --seconds 2：CI 上缩短单接口测量窗口（10 接口约 20s+启动开销）；
      # 基线 JSON 写 /tmp 不覆盖仓库基线（基线更新是显式的人为动作：
      # 本地 python scripts/perf_baseline.py 全量跑后 commit）。
      - name: "Perf baseline compare (alarm-only, P2-1)"
        run: >
          python scripts/perf_baseline.py
          --seconds 2
          --compare scripts/perf_baseline.json
          --output /tmp/perf_current.json

      - name: "Upload current perf result"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-current
          path: /tmp/perf_current.json
          if-no-files-found: ignore
          retention-days: 30

  docs-skip:
    needs: changes
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Record documentation-only performance decision
        run: echo "Documentation-only change; performance baseline remains enabled for full and scheduled runs."

  # The selected branch must finish successfully; skipped/cancelled is never green.
  # Preserve advisory perf failures explicitly; missing/skipped/cancelled still fail aggregation.
  gate:
    if: ${{ always() }}
    needs: ["changes", "docs-skip", "perf"]
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful classification and selected checks
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          python - <<'PY'
          import json
          import os
          needs = json.loads(os.environ['NEEDS_JSON'])
          if needs.get('changes', {}).get('result') != 'success':
              raise SystemExit('Change classification did not succeed')
          docs_only = (os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] == 'refs/heads/main'
                       and needs['changes'].get('outputs', {}).get('docs_only') == 'true')
          required = ['docs-skip'] if docs_only else ['perf']
          if not docs_only and needs.get('perf', {}).get('result') == 'failure':
              print('::warning::Performance baseline failed; advisory-only behavior is preserved')
              required = []
          failed = {name: needs.get(name, {}).get('result', 'missing')
                    for name in required if needs.get(name, {}).get('result') != 'success'}
          if failed:
              raise SystemExit('Required checks did not succeed: ' + json.dumps(failed, sort_keys=True))
          print(('docs' if docs_only else 'full') + ': all required checks succeeded')
          PY
