name: WMS AI Verification

on:
  push:
    branches: [main, 'feature/*', 'ai/*']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r app/requirements.txt

      - name: Run source encoding check
        run: python3 scripts/verify_source_encoding.py

      - name: Run AI core verification
        run: python3 scripts/verify_ai_all.py --level core

      - name: Run WMS bug regression
        run: python3 scripts/verify_wms_bugs.py

      - name: Run AI tool compliance check (AI-R02)
        run: python3 scripts/verify_ai_tool_compliance.py

      - name: Run AI ledger consistency check (AI-R02)
        run: python3 scripts/verify_ai_ledger_consistency.py

      - name: Run AI golden samples check (AI-R03)
        run: python3 scripts/verify_ai_golden_samples.py

      - name: Run AI image preprocessing check (AI-R04)
        run: python3 scripts/verify_ai_image_preprocessing.py

      - name: Run AI provider evaluation check (AI-R05)
        run: python3 scripts/verify_ai_provider_evaluation.py

      - name: Run AI delivery matcher check (AI-R06)
        run: python3 scripts/verify_ai_delivery_matcher.py

      - name: Run AI material governance check (AI-R07)
        run: python3 scripts/verify_ai_material_governance.py

      - name: Run AI document confirmation check (AI-R08)
        run: python3 scripts/verify_ai_document_confirmation.py

      - name: Run AI field feedback check (AI-R09)
        run: python3 scripts/verify_ai_field_feedback.py

      - name: Run AI warehouse workbench check (AI-R10)
        run: python3 scripts/verify_ai_warehouse_workbench.py

      - name: Run AI purchase followup workbench check (AI-R11)
        run: python3 scripts/verify_ai_purchase_followup_workbench.py

      - name: Run AI knowledge lifecycle check (AI-R12)
        run: python3 scripts/verify_ai_knowledge_lifecycle.py

      - name: Run AI budget control check (AI-R13)
        run: python3 scripts/verify_ai_budget_control.py

      - name: Run AI data retention check (AI-R14)
        run: python3 scripts/verify_ai_data_retention.py

      - name: Run AI business quality check (AI-R15)
        run: python3 scripts/verify_ai_business_quality.py

      - name: Run AI browser E2E check (AI-R16)
        run: python3 scripts/verify_ai_browser_e2e.py

      - name: Run AI launch acceptance check (AI-R17)
        run: python3 scripts/verify_ai_launch_acceptance.py

      - name: Run AI rollout control check (AI-R17-F01)
        run: python3 scripts/verify_ai_rollout_control.py

      - name: Run AI acceptance evidence check (AI-R17-F02)
        run: python3 scripts/verify_ai_acceptance_evidence.py
