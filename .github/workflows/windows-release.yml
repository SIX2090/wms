name: Windows Portable Release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [WMS CI]
    types: [completed]
    branches: [main]
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify exact accepted main and choose release version
        id: release
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $remote = gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $sha -ne $remote) { throw 'Only current accepted main may be packaged.' }
          python scripts/check_ci_green.py --target-sha $sha --json
          if ($LASTEXITCODE -ne 0) { throw 'Full CI gate was not verified.' }
          $version = python -c "import runpy; print(runpy.run_path('app/version.py')['__version__'])"
          if ($version -notmatch '^20[0-9]{2}\.[0-9]{2}\.[0-9]+$') { throw 'Invalid version.' }
          $work = Join-Path $env:RUNNER_TEMP "wms-release-${{ github.run_id }}-${{ github.run_attempt }}"
          python tools/windows_release.py plan --root $pwd --version $version --work $work --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'Release inputs or existing assets were not verified.' }
      - name: Download pinned Windows offline wheels
        if: steps.release.outputs.state == 'build'
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse -r app/requirements.txt pip==26.1.1 setuptools==82.0.1 wheel==0.47.0
          if ($LASTEXITCODE -ne 0) { throw 'Offline download failed.' }
      - name: Build and verify a disposable installation
        if: steps.release.outputs.state == 'build'
        shell: powershell
        run: |
          $package = Join-Path $pwd 'dist/WMS-${{ steps.release.outputs.version }}'
          ./tools/build_portable_dist.ps1 -DistDir $package
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          $work = '${{ steps.release.outputs.work_dir }}'
          python tools/check_portable_runtime.py --package $package --receipt "$work/${{ steps.release.outputs.runtime }}"
          if ($LASTEXITCODE -ne 0) { throw 'Portable startup verification failed.' }
          $zip = Join-Path $work '${{ steps.release.outputs.archive }}'
          Compress-Archive -LiteralPath $package -DestinationPath $zip
          python tools/windows_release.py seal --plan "$work/plan.json" --package $package --archive $zip
          if ($LASTEXITCODE -ne 0) { throw 'Exact archive or runtime receipt verification failed.' }
      - name: Publish verified Windows preview release
        if: steps.release.outputs.state == 'build'
        shell: pwsh
        run: |
          python tools/windows_release.py publish --plan '${{ steps.release.outputs.work_dir }}/plan.json' --notes tools/PORTABLE_README.txt
          if ($LASTEXITCODE -ne 0) { throw 'Release publication or uploaded asset verification failed.' }
      - name: Record verified build or reuse
        shell: pwsh
        run: |
          $plan = Get-Content -Raw '${{ steps.release.outputs.work_dir }}/plan.json' | ConvertFrom-Json
          $state = if ($plan.state -eq 'build') { 'built_verified' } else { $plan.state }
          $source = if ($plan.reused_source_sha) { $plan.reused_source_sha } else { $plan.source_sha }
          "Windows release: $state; accepted main: $($plan.source_sha); package source: $source; tag: $($plan.names.tag)" >> $env:GITHUB_STEP_SUMMARY
