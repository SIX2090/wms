name: Windows Portable Release
on:
  workflow_dispatch:
  workflow_run:
    workflows: [WMS CI]
    types: [completed]
    branches: [main]
concurrency:
  group: windows-portable-release
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify exact accepted main and choose release version
        id: release
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          $remote = gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $sha -ne $remote) { throw 'Only current accepted main may be packaged.' }
          python scripts/check_ci_green.py --target-sha $sha --json
          if ($LASTEXITCODE -ne 0) { throw 'Full CI gate was not verified.' }
          $version = python -c "import runpy; print(runpy.run_path('app/version.py')['__version__'])"
          if ($version -notmatch '^20[0-9]{2}\.[0-9]{2}\.[0-9]+$') { throw 'Invalid version.' }
          $tag = "windows-v$version"
          $tags = gh api repos/${{ github.repository }}/releases --paginate --jq '.[].tag_name'
          if ($LASTEXITCODE -ne 0) { throw 'Could not check existing releases.' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "exists=$($tags -contains $tag)" >> $env:GITHUB_OUTPUT
      - name: Download pinned Windows offline wheels
        if: steps.release.outputs.exists != 'True'
        shell: pwsh
        run: |
          python -m pip download --only-binary=:all: --dest wheelhouse -r app/requirements.txt pip==26.1.1 setuptools==82.0.1 wheel==0.47.0
          if ($LASTEXITCODE -ne 0) { throw 'Offline download failed.' }
      - name: Build and verify a disposable installation
        if: steps.release.outputs.exists != 'True'
        shell: powershell
        run: |
          $package = Join-Path $pwd 'dist/WMS-${{ steps.release.outputs.version }}'
          ./tools/build_portable_dist.ps1 -DistDir $package
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
          python tools/check_portable_runtime.py --package $package
          if ($LASTEXITCODE -ne 0) { throw 'Portable startup verification failed.' }
          Compress-Archive -LiteralPath $package -DestinationPath "dist/WMS-${{ steps.release.outputs.version }}-windows-x64.zip"
          $zip = "dist/WMS-${{ steps.release.outputs.version }}-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($zip))" | Set-Content -Encoding ascii "$zip.sha256"
      - name: Publish verified Windows preview release
        if: steps.release.outputs.exists != 'True'
        shell: pwsh
        run: |
          $sha = '${{ steps.release.outputs.sha }}'
          $remote = gh api repos/${{ github.repository }}/git/ref/heads/main --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $remote -ne $sha) { throw 'main changed; do not publish a stale package.' }
          gh release create '${{ steps.release.outputs.tag }}' 'dist/*.zip' 'dist/*.sha256' --target $sha --title 'WMS Windows ${{ steps.release.outputs.version }}' --notes-file tools/PORTABLE_README.txt --prerelease
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
