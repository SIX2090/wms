# Robolectric 全局配置
#
# ## 为什么 sqliteMode=LEGACY（不要改成 NATIVE / 删掉本文件）
#
# Robolectric 4.9+ 起，SDK 26+ 默认用**原生 SQLite**（libsqlite3.so 走 native
# runtime）跑单测。该 native runtime 在 GitHub Actions 的 ubuntu runner 上
# 有两条已确认的崩溃路径，且都是**整次 JVM被杀**（exit 134），不是普通断言失败：
#
#   1. walIndexAppend  SIGBUS —— BUG-2026-09-21-005 修复时踩到，
#      当时只在 PendingQueueRebuildProtectionTest 上加了 @SQLiteMode(LEGACY)。
#   2. nativeClose    SIGSEGV —— 2026-10-13 踩到，
#      ScanFeedbackTest 打开 SQLiteConnection 后 JVM 崩在
#      librobolectric-nativeruntime.so 的 android::nativeClose。
#
# 第 2 条恰好印证了第 1 条那次修复的教训：**逐个测试类加注解治标不治本**——
# native 崩溃取决于「本进程是否碰过 SQLite」，与具体测试类无关。只要还有任何一个
# 测试类建库，同一个 worker 里的全部用例都会被一起带走（崩溃发生在 native 层，
# Gradle 只能报 "Gradle Test Executor 1 finished with non-zero exit value 134"，
# 不指向任何具体断言）。
#
# 故把开关下沉到全局配置：**一次设定，所有测试类受约束**，新增测试不会再漏。
# LEGACY 引擎是 Robolectric 的纯 Java 实现，功能完整，只是没有 native 加速——
# 单测要的是行为正确，不是性能。
#
# ## 「本类需要 WAL 语义」不构成留例外的理由
#
# 曾给 PendingQueueRebuildProtectionTest 挂过类级 @SQLiteMode(NATIVE) 例外，理由是
# 「它验证备份/回补链路，被测语义是 WAL 恢复后的主文件」。实测该例外行不通：
#
#   * 全局 LEGACY 下 Robolectric 根本不加载 native runtime，类级 NATIVE 覆盖直接
#     抛 UnsatisfiedLinkError: nativeFinalizeStatement；
#   * 而 LEGACY 下它原本的失败（SQLITE_BUSY）根因不是引擎，而是测试自己种数据时
#     多切了一次 journal_mode ——那是 BUG-2026-10-08-014 期间为对抗「WAL recovery
#     读到空」加的补救，事后证明是**对不存在的问题出手**：purgeDatabase() 已把库
#     文件整个删除，新文件默认就不是 WAL。
#
# 真正的教训：**同一个根因可以有两种表现，修复却必须落在根因上。**
# SIGBUS（切 journal_mode 走 walIndexAppend）与 SQLITE_BUSY（切换留下未完成事务）
# 表面毫不相干，实际都出自那两行 PRAGMA。删掉它们后该类回归全局 LEGACY，无需任何
# 例外——本文件因此保持「唯一开关、零例外」。
#
# 代价与边界：LEGACY 不覆盖 native 层特有的行为（如某些 PRAGMA 的实现差异）。
# 真机 / instrumented test 仍是最终验收依据（AGENTS.md R8）。
sqliteMode=LEGACY

# sdk 与各测试类的 @Config(sdk = [31]) 对齐：现场设备 HUAWEI LIO-AN00 是
# Android 12 / sdk 31。放在这里是为了让**新增**测试不必重复写，也避免默认值
# 随 Robolectric 版本漂移。
sdk=31