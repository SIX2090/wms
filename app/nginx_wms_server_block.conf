# WMS HTTPS reverse proxy for gd2026.top
# Put this server block inside the active nginx http { ... } section.
# It forwards public HTTPS traffic to the local WMS service on 127.0.0.1:8080.

server {
    listen 443 ssl;
    server_name gd2026.top www.gd2026.top;

    ssl_certificate     server.pem;
    ssl_certificate_key server.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WMSSSL:10m;
    # TLSv1/TLSv1.1 are deprecated (RFC 8996). Only TLSv1.2 and TLSv1.3 are secure.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200m;
    access_log logs/wms.access.log main;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 600;
    proxy_send_timeout 600;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}

