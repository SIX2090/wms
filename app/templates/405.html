<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>请求方式不被允许 - 仓库管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #fff7e6 0%, #fff1f0 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            padding: 48px 40px;
            max-width: 480px;
            width: 90%;
            text-align: center;
        }
        .error-code {
            font-size: 64px;
            font-weight: 700;
            color: #fa8c16;
            margin-bottom: 8px;
            line-height: 1;
        }
        .icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fff7e6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 40px;
        }
        h1 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #262626;
        }
        p {
            font-size: 14px;
            line-height: 1.7;
            color: #595959;
            margin-bottom: 24px;
        }
        .path {
            background: #f5f5f5;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: "Consolas", "Monaco", monospace;
            font-size: 12px;
            color: #8c8c8c;
            margin-bottom: 24px;
            word-break: break-all;
        }
        .btn-group { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            border: 1px solid transparent;
            transition: all 0.2s;
        }
        .btn-primary {
            background: #fa8c16;
            color: #fff;
            border-color: #fa8c16;
        }
        .btn-primary:hover {
            background: #ffa940;
            border-color: #ffa940;
        }
        .btn-default {
            background: #fff;
            color: #595959;
            border-color: #d9d9d9;
        }
        .btn-default:hover {
            color: #fa8c16;
            border-color: #fa8c16;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="error-code">405</div>
        <div class="icon">&#x1F6AB;</div>
        <h1>请求方式不被允许</h1>
        <p>该页面不支持当前访问方式，请检查操作流程或联系管理员。</p>
        <div class="path">{{ request.path if request else '' }}</div>
        <div class="btn-group">
            <a href="/" class="btn btn-primary">返回首页</a>
            <a href="javascript:history.back();" class="btn btn-default">返回上一页</a>
        </div>
    </div>
</body>
</html>
