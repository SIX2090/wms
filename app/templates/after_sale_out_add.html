{% extends "base.html" %}

{% block title %}{{ page_title or '新增售后出库单' }}{% endblock %}

{% block extra_css %}
<style>
.page-header {
    background: #fff;
    padding: 12px 16px;
    border-bottom: 1px solid #D9D9D9;
    margin-bottom: 0;
}
.page-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin: 0;
}
.card {
    border: none;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
}
.card-body {
    padding: 10px 16px;
}
.form-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 3px;
    font-weight: 400;
}
.form-control, .form-select {
    border: 1px solid #D9D9D9;
    border-radius: 2px;
    padding: 3px 8px;
    font-size: 12px;
    min-height: 28px;
    background: #fff;
}
.form-control:focus, .form-select:focus {
    border-color: #1890FF;
    box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
    outline: none;
}
.form-control[readonly] {
    background-color: #F5F5F5;
    color: #666;
}
.material-input {
    position: relative;
}
.material-input input {
    width: 100%;
    border: 1px solid transparent;
    padding: 3px 18px 3px 4px;
    border-radius: 2px;
    font-size: 12px;
    height: 26px;
    background: transparent;
}
.material-input input:focus {
    border-color: #1890FF;
    outline: none;
    background: #fff;
}
.material-dropdown {
    position: fixed;
    min-width: 380px;
    max-height: 280px;
    overflow-y: auto;
    background: white;
    border: 1px solid #D9D9D9;
    border-radius: 3px;
    z-index: 99999;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
.material-dropdown-item {
    padding: 6px 10px;
    cursor: pointer;
    border-bottom: 1px solid #F0F0F0;
    font-size: 12px;
}
.material-dropdown-item:hover {
    background-color: #E6F7FF;
}
.material-dropdown-item .code {
    font-weight: 600;
    color: #1890FF;
}
.material-dropdown-item .spec,
.material-dropdown-item .unit {
    color: #999;
    font-size: 11px;
}
#materialTable {
    margin-bottom: 0 !important;
    border-collapse: collapse !important;
    width: 100% !important;
}
#materialTable thead th {
    background: #FAFAFA !important;
    color: #333 !important;
    font-weight: 500 !important;
    padding: 7px 8px !important;
    border: 1px solid #E8E8E8 !important;
    font-size: 12px !important;
    white-space: nowrap !important;
    text-align: center !important;
}
#materialTable tbody td {
    padding: 0 4px !important;
    vertical-align: middle !important;
    font-size: 12px !important;
    border: 1px solid #E8E8E8 !important;
    height: 30px !important;
}
#materialTable tbody td input.form-control {
    border: 1px solid transparent !important;
    background: transparent !important;
    padding: 2px 4px !important;
    height: 26px !important;
    font-size: 12px !important;
    width: 100% !important;
}
.row-num {
    width: 42px;
    text-align: center;
    color: #999;
}
.action-col {
    width: 60px;
    text-align: center;
    white-space: nowrap;
}
.amount-col, .num-col {
    text-align: right;
}
#materialTable tfoot td {
    padding: 8px !important;
    font-size: 12px !important;
    border: 1px solid #E8E8E8 !important;
    font-weight: 600 !important;
    background: #FFFBE6 !important;
}
.footer-bar {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    padding: 12px 0;
}
</style>
{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2><i class="bi bi-box-arrow-up"></i> {{ page_title or '新增售后出库单' }}</h2>
    <div class="d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-primary" onclick="submitForm()">
            <i class="bi bi-save"></i> 保存
        </button>
        <a href="/after_sale_out" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i> 返回列表
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form id="addForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="order_id" value="{{ order_id or '' }}">
            <input type="hidden" name="order_no" value="{{ order_no }}">

            <div class="row mb-3">
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">单据编号</label>
                        <input type="text" class="form-control" value="{{ order_no }}" readonly>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">日期</label>
                        <input type="date" class="form-control" name="date" value="{{ order_date }}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">客户名称</label>
                        <div class="customer-input" style="position:relative;">
                            <input type="text" class="form-control" id="customerSearch" name="customer" placeholder="请选择或输入客户名称" autocomplete="off" value="{{ order.customer if order else '' }}">
                            <div id="customerDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;min-width:100%;max-height:200px;overflow-y:auto;background:white;border:1px solid #d9d9d9;border-radius:4px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);margin-top:2px;"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">联系人</label>
                        <input type="text" class="form-control" name="contact" placeholder="请输入联系人" value="{{ order.contact if order else '' }}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">联系电话</label>
                        <input type="text" class="form-control" name="phone" placeholder="请输入联系电话" value="{{ order.phone if order else '' }}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">仓库 <span class="text-danger">*</span></label>
                        <select class="form-select" name="warehouse" required>
                            <option value="">请选择仓库</option>
                            {% for warehouse in warehouses %}
                            <option value="{{ warehouse.name }}" {% if (order and order.warehouse == warehouse.name) or (not order or not order.warehouse) and default_warehouse and default_warehouse.name == warehouse.name %}selected{% endif %}>{{ warehouse.name }}</option>
                            {% endfor %}
                            {% if order and order.warehouse and order.warehouse not in warehouses|map(attribute='name')|list %}
                            <option value="{{ order.warehouse }}" selected>{{ order.warehouse }}</option>
                            {% endif %}
                        </select>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">售后原因</label>
                        <input type="text" class="form-control" name="reason" placeholder="请输入售后原因" value="{{ order.reason if order else '' }}">
                        <input type="number" class="form-control mt-2" name="source_sales_order_id" placeholder="原销售订单ID（可选）" value="{{ order.source_sales_order_id if order else '' }}">
                        <input type="number" class="form-control mt-2" name="source_out_order_id" placeholder="原销售出库单ID（可选）" value="{{ order.source_out_order_id if order else '' }}">
                        <input type="text" class="form-control mt-2" name="responsibility" placeholder="责任归属（可选）" value="{{ order.responsibility if order else '' }}">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-2">
                        <label class="form-label">备注</label>
                        <textarea class="form-control" name="remark" rows="2">{{ order.remark if order else '' }}</textarea>
                    </div>
                </div>
            </div>

            <div class="mb-3 d-flex gap-2 flex-wrap">
                <button type="button" class="btn btn-primary" onclick="addNewRow()">
                    <i class="bi bi-plus"></i> 添加物料
                </button>
            </div>

            <div class="table-responsive">
                <table id="materialTable">
                    <thead>
                        <tr>
                            <th class="row-num" data-column-key="row_no">序号<span class="col-resize"></span></th>
                            <th style="width: 150px;" data-column-key="material_code">物料编码<span class="col-resize"></span></th>
                            <th style="width: 100px;" data-column-key="brand">品牌<span class="col-resize"></span></th>
                            <th data-column-key="material_name">物料名称<span class="col-resize"></span></th>
                            <th style="width: 100px;" data-column-key="spec">规格<span class="col-resize"></span></th>
                            <th style="width: 70px;" data-column-key="unit">单位<span class="col-resize"></span></th>
                            <th style="width: 90px;" data-column-key="stock">当前库存<span class="col-resize"></span></th>
                            <th style="width: 100px;" data-column-key="quantity">数量<span class="col-resize"></span></th>
                            <th style="width: 100px;" data-column-key="price">单价<span class="col-resize"></span></th>
                            <th style="width: 100px;" class="amount-col" data-column-key="amount">金额<span class="col-resize"></span></th>
                            <th style="width: 140px;" data-column-key="remark">备注<span class="col-resize"></span></th>
                            <th class="action-col" data-column-key="actions">操作<span class="col-resize"></span></th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody"></tbody>
                    <tfoot>
                        <tr>
                            <td colspan="9" class="text-end"><strong>合计：</strong></td>
                            <td class="amount-col" data-column-key="amount"><strong id="totalAmount">¥0.00</strong></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const materials = {{ materials|tojson }};
const customers = {{ customers|tojson }};
const initialItems = {{ initial_items|default([])|tojson }};
let activeDropdown = null;

function escapeHtml(value) {
    return String(value || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function addNewRow(insertBeforeRow = null, data = {}) {
    const tbody = document.getElementById('materialTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td class="row-num" data-column-key="row_no"></td>
        <td data-column-key="material_code">
            <div class="material-input">
                <input type="text" class="form-control material-code" placeholder="">
                <div class="material-dropdown" style="display:none;"></div>
            </div>
        </td>
        <td data-column-key="brand"><input type="text" class="form-control material-brand" readonly></td>
        <td data-column-key="material_name"><input type="text" class="form-control material-name" readonly></td>
        <td data-column-key="spec"><input type="text" class="form-control material-spec" readonly></td>
        <td data-column-key="unit"><input type="text" class="form-control material-unit" readonly></td>
        <td data-column-key="stock"><input type="text" class="form-control material-stock num-col" readonly></td>
        <td data-column-key="quantity"><input type="number" class="form-control material-qty num-col" min="0" step="0.01"></td>
        <td data-column-key="price"><input type="number" class="form-control material-price num-col" min="0" step="0.01"></td>
        <td class="amount-col" data-column-key="amount"><input type="text" class="form-control material-amount" readonly></td>
        <td data-column-key="remark"><input type="text" class="form-control material-remark" maxlength="500"></td>
        <td class="action-col" data-column-key="actions">
            <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="insertRowBefore(this)" title="插入行"><i class="bi bi-plus-circle"></i></button>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteRow(this)" title="删除行"><i class="bi bi-trash"></i></button>
        </td>
    `;
    if (insertBeforeRow) {
        tbody.insertBefore(row, insertBeforeRow);
    } else {
        tbody.appendChild(row);
    }
    bindRow(row);
    fillRowData(row, data);
    renumberRows();
    calcAmount(row);
    return row;
}

function fillRowData(row, data) {
    if (!data) return;
    row.querySelector('.material-code').value = data.material_code || data.code || '';
    const rowMaterial = materials.find(m => m.code === (data.material_code || data.code || ''));
    row.querySelector('.material-brand').value = data.brand || (rowMaterial && rowMaterial.brand) || '';
    row.querySelector('.material-name').value = data.material_name || data.name || '';
    row.querySelector('.material-spec').value = data.spec || '';
    row.querySelector('.material-unit').value = data.unit_name || data.unit || '';
    row.querySelector('.material-stock').value = Number.isFinite(parseFloat(data.stock)) ? parseFloat(data.stock).toFixed(2) : '';
    row.querySelector('.material-qty').value = data.quantity || '';
    row.querySelector('.material-price').value = data.price || '';
    const remarkInput = row.querySelector('.material-remark');
    if (remarkInput) remarkInput.value = data.remark || '';
}

function bindRow(row) {
    row.querySelector('.material-code').addEventListener('input', function() {
        showDropdown(row);
    });
    row.querySelector('.material-code').addEventListener('keydown', function(event) {
        if (event.key === 'Escape') {
            row.querySelector('.material-dropdown').style.display = 'none';
            activeDropdown = null;
        }
    });
    row.querySelector('.material-qty').addEventListener('input', function() {
        calcAmount(row);
    });
    row.querySelector('.material-price').addEventListener('input', function() {
        calcAmount(row);
    });
}

function showDropdown(row, showAll = false) {
    const input = row.querySelector('.material-code');
    const dropdown = row.querySelector('.material-dropdown');
    const keyword = input.value.toLowerCase().trim();

    if (activeDropdown && activeDropdown !== dropdown) {
        activeDropdown.style.display = 'none';
    }

    const filtered = materials.filter(m =>
        showAll ||
        String(m.code || '').toLowerCase().includes(keyword) ||
        String(m.name || '').toLowerCase().includes(keyword) ||
        (m.brand && String(m.brand).toLowerCase().includes(keyword)) ||
        (m.spec && String(m.spec).toLowerCase().includes(keyword))
    );

    if (filtered.length === 0) {
        dropdown.style.display = 'none';
        return;
    }

    dropdown.innerHTML = filtered.map(m => `
        <div class="material-dropdown-item" data-code="${m.code}">
            <span class="code">${m.code}</span> - <span class="name">${m.name}</span>
            <span class="spec">${m.brand || ''}</span>
            <span class="spec">${m.spec || ''}</span>
            <span class="unit">${m.unit ? m.unit.name : ''}</span>
        </div>
    `).join('');

    dropdown.querySelectorAll('.material-dropdown-item').forEach(item => {
        item.addEventListener('click', function() {
            selectMaterial(row, this.dataset.code);
        });
    });

    const rect = input.getBoundingClientRect();
    dropdown.style.top = (rect.bottom + 5) + 'px';
    dropdown.style.left = rect.left + 'px';
    dropdown.style.display = 'block';
    activeDropdown = dropdown;
}

function selectMaterial(row, code) {
    const material = materials.find(m => m.code === code);
    if (!material) return;

    row.querySelector('.material-code').value = material.code;
    row.querySelector('.material-brand').value = material.brand || '';
    row.querySelector('.material-name').value = material.name;
    row.querySelector('.material-spec').value = material.spec || '';
    row.querySelector('.material-unit').value = material.unit ? material.unit.name : '';
    row.querySelector('.material-stock').value = Number.isFinite(parseFloat(material.stock)) ? parseFloat(material.stock).toFixed(2) : '0.00';
    if (!row.querySelector('.material-price').value || Number(row.querySelector('.material-price').value) === 0) {
        row.querySelector('.material-price').value = material.price || 0;
    }

    row.querySelector('.material-dropdown').style.display = 'none';
    activeDropdown = null;
    calcAmount(row);
}

function calcAmount(row) {
    const qty = parseFloat(row.querySelector('.material-qty').value) || 0;
    const price = parseFloat(row.querySelector('.material-price').value) || 0;
    row.querySelector('.material-amount').value = qty || price ? (qty * price).toFixed(2) : '';
    calcTotal();
}

function calcTotal() {
    let total = 0;
    document.querySelectorAll('#materialTableBody tr').forEach(row => {
        total += parseFloat(row.querySelector('.material-amount').value) || 0;
    });
    document.getElementById('totalAmount').textContent = '¥' + total.toFixed(2);
}

function deleteRow(btn) {
    btn.closest('tr').remove();
    renumberRows();
    calcTotal();
}

function insertRowBefore(btn) {
    const currentRow = btn.closest('tr');
    const newRow = addNewRow(currentRow);
    newRow.querySelector('.material-code').focus();
    return newRow;
}

function copyRowAfter(row) {
    if (!row) {
        const emptyRow = addNewRow();
        emptyRow.querySelector('.material-code').focus();
        return;
    }
    const target = row.nextElementSibling ? insertRowBefore(row.nextElementSibling) : addNewRow();
    ['material-code', 'material-brand', 'material-name', 'material-spec', 'material-unit', 'material-stock', 'material-qty', 'material-price'].forEach(cls => {
        target.querySelector('.' + cls).value = row.querySelector('.' + cls).value;
    });
    calcAmount(target);
    target.querySelector('.material-qty').focus();
    target.querySelector('.material-qty').select();
}

function renumberRows() {
    document.querySelectorAll('#materialTableBody tr').forEach((row, index) => {
        row.querySelector('.row-num').textContent = index + 1;
    });
}

function submitForm() {
    const items = [];
    for (const row of document.querySelectorAll('#materialTableBody tr')) {
        const code = row.querySelector('.material-code').value.trim();
        const qty = parseFloat(row.querySelector('.material-qty').value);
        const price = parseFloat(row.querySelector('.material-price').value);
        if (!code) continue;
        if (!qty || qty <= 0) {
            showToast('请填写完整的物料信息', 'warning');
            return;
        }
        items.push({ code, quantity: qty, price: price || 0, remark: (row.querySelector('.material-remark')?.value || '').trim() });
    }

    if (items.length === 0) {
        showToast('请至少添加一条物料', 'warning');
        return;
    }

    const warehouse = document.querySelector('[name="warehouse"]').value.trim();
    if (!warehouse) {
        showToast('仓库不能为空，请选择仓库', 'warning');
        return;
    }

    const data = {
        order_id: document.querySelector('[name="order_id"]').value,
        order_no: document.querySelector('[name="order_no"]').value,
        date: document.querySelector('[name="date"]').value,
        customer: document.querySelector('[name="customer"]').value,
        contact: document.querySelector('[name="contact"]').value,
        phone: document.querySelector('[name="phone"]').value,
        warehouse: document.querySelector('[name="warehouse"]').value,
        reason: document.querySelector('[name="reason"]').value,
        source_sales_order_id: document.querySelector('[name="source_sales_order_id"]').value,
        source_out_order_id: document.querySelector('[name="source_out_order_id"]').value,
        responsibility: document.querySelector('[name="responsibility"]').value,
        remark: document.querySelector('[name="remark"]').value,
        items: items
    };

    fetch('/after_sale_out/add', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            showToast('保存成功', 'success');
            setTimeout(function() { window.location.href = `/after_sale_out/${data.id}`; }, 400);
        } else {
            showToast('保存失败：' + data.msg, 'danger');
        }
    })
    .catch(error => {
        showToast('保存失败：' + error.message, 'danger');
    });
}

document.addEventListener('click', function(e) {
    if (activeDropdown && !e.target.closest('.material-input')) {
        activeDropdown.style.display = 'none';
        activeDropdown = null;
    }
});

document.addEventListener('DOMContentLoaded', function() {
    if (initialItems.length) {
        initialItems.forEach(function(item) {
            addNewRow(null, item);
        });
    }
    // 无初始数据时默认预置 30 行空白明细行，便于直接录入。
    if (!initialItems.length) {
        for (let i = 0; i < 30; i++) {
            addNewRow();
        }
    }
    registerDetailRowActions({
        tableSelector: '#materialTable',
        rowSelector: '#materialTableBody tr',
        add: function() {
            const row = addNewRow();
            row.querySelector('.material-code').focus();
        },
        insert: function(row) { insertRowBefore(row); },
        copy: function(row) { copyRowAfter(row); },
        remove: function(row) { deleteRow(row); }
    });
    // ==================== 明细表字段位置和列宽 ====================
    if (typeof setupDynamicDetailColumnControls === 'function') {
        window.afterSaleOutColumnController = setupDynamicDetailColumnControls({
            tableSelector: '#materialTable',
            orderKey: 'after_sale_out_col_order_v1',
            widthKey: 'after_sale_out_col_widths_v1',
            lockedColumns: ['row_no', 'actions'],
            minWidths: {
                row_no: 42,
                actions: 92,
                material_code: 120,
                brand: 90,
                material_name: 140,
                spec: 80,
                unit: 60,
                stock: 90,
                quantity: 80,
                price: 80,
                amount: 90,
                remark: 120
            }
        });
    }
    setupCustomerSearch();
    try {
        if (typeof BroadcastChannel !== 'undefined') {
            const masterBc = new BroadcastChannel('wms_master_data_update');
            masterBc.onmessage = function(event) {
                if (event.data && event.data.type === 'customer_updated') refreshCustomers();
            };
        }
    } catch(e) {}
});

function filterCustomers(keyword) {
    return customers.filter(function(c) {
        if (!keyword) return true;
        return String(c.name || '').toLowerCase().includes(keyword) ||
               String(c.code || '').toLowerCase().includes(keyword) ||
               String(c.phone || '').toLowerCase().includes(keyword) ||
               String(c.contact || '').toLowerCase().includes(keyword);
    }).slice(0, 80);
}

function showCustomerDropdown(list) {
    const dropdown = document.getElementById('customerDropdown');
    const input = document.getElementById('customerSearch');
    if (!dropdown || !input) return;
    if (!list.length) {
        dropdown.style.display = 'none';
        return;
    }
    dropdown.innerHTML = list.map(function(c) {
        const code = c.code ? '<span style="color:#999;margin-left:6px;">' + escapeHtml(c.code) + '</span>' : '';
        const phone = c.phone ? '<span style="color:#999;margin-left:6px;">' + escapeHtml(c.phone) + '</span>' : '';
        return '<div class="customer-item" data-name="' + escapeHtml(c.name || '') + '" style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;"><strong>' + escapeHtml(c.name || '') + '</strong>' + code + phone + '</div>';
    }).join('');
    dropdown.querySelectorAll('.customer-item').forEach(function(item) {
        item.addEventListener('mousedown', function(event) {
            event.preventDefault();
            input.value = this.dataset.name || '';
            dropdown.style.display = 'none';
        });
    });
    dropdown.style.display = 'block';
}

function setupCustomerSearch() {
    const input = document.getElementById('customerSearch');
    const dropdown = document.getElementById('customerDropdown');
    if (!input || !dropdown) return;
    input.addEventListener('focus', function() { showCustomerDropdown(filterCustomers(this.value.trim().toLowerCase())); });
    input.addEventListener('input', function() { showCustomerDropdown(filterCustomers(this.value.trim().toLowerCase())); });
    input.addEventListener('keydown', function(event) { if (event.key === 'Escape') dropdown.style.display = 'none'; });
    document.addEventListener('click', function(event) {
        if (!event.target.closest('.customer-input')) dropdown.style.display = 'none';
    });
}

function refreshCustomers() {
    fetch('/api/customers')
        .then(function(r){ return r.json(); })
        .then(function(list) {
            if (Array.isArray(list)) {
                customers.length = 0;
                list.forEach(function(c){ customers.push(c); });
            }
        })
        .catch(function() {});
}
</script>
{% endblock %}
