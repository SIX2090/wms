{% extends "base.html" %}
{% block title %}首次登录修改密码{% endblock %}
{% block body_class %}embedded-page{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-2">首次登录，请修改密码</h4>
      <p class="text-muted">当前密码为系统初始密码，修改完成后才能继续使用 WMS。</p>
      <form id="changePasswordForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">当前密码</label><input class="form-control" type="password" name="current_password" required autocomplete="current-password"></div>
        <div class="mb-3"><label class="form-label">新密码</label><input class="form-control" type="password" name="new_password" required autocomplete="new-password"></div>
        <div class="mb-3"><label class="form-label">确认新密码</label><input class="form-control" type="password" name="confirm_password" required autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit">修改密码并继续</button>
      </form>
      <div id="message" class="alert d-none mt-3 mb-0"></div>
    </div>
  </div>
</div>
<script>
document.getElementById('changePasswordForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  if (this.dataset.submitting === 'true') return;
  const button = this.querySelector('button[type="submit"]');
  const message = document.getElementById('message');
  let navigating = false;
  this.dataset.submitting = 'true';
  button.disabled = true;
  message.className = 'alert alert-info mt-3 mb-0';
  message.textContent = '正在保存...';
  try {
    const data = await WMS.api.postRaw('{{ url_for("change_own_password") }}', new FormData(this));
    if (data && data.status === 'success') {
      message.className = 'alert alert-success mt-3 mb-0';
      message.textContent = data.msg || '密码修改成功';
      navigating = true;
      window.location.href = data.redirect || '/';
    } else {
      message.className = 'alert alert-danger mt-3 mb-0';
      message.textContent = (data && data.msg) || '修改失败';
    }
  } catch (error) {
    message.className = 'alert alert-danger mt-3 mb-0';
    message.textContent = '修改失败：' + ((error && error.message) || '请求失败，请稍后重试');
  } finally {
    if (!navigating) {
      this.dataset.submitting = '';
      button.disabled = false;
    }
  }
});
</script>
{% endblock %}
