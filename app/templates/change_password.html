{% extends "base.html" %}
{% block title %}首次登录修改密码{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 520px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-2">首次登录，请修改密码</h4>
      <p class="text-muted">当前密码为系统初始密码，修改完成后才能继续使用 WMS。</p>
      <form id="changePasswordForm">
        <div class="mb-3"><label class="form-label">当前密码</label><input class="form-control" type="password" name="current_password" required autocomplete="current-password"></div>
        <div class="mb-3"><label class="form-label">新密码</label><input class="form-control" type="password" name="new_password" required minlength="8" autocomplete="new-password"></div>
        <div class="mb-3"><label class="form-label">确认新密码</label><input class="form-control" type="password" name="confirm_password" required minlength="8" autocomplete="new-password"></div>
        <button class="btn btn-primary" type="submit">修改密码并继续</button>
      </form>
      <div id="message" class="alert d-none mt-3 mb-0"></div>
    </div>
  </div>
</div>
<script>
document.getElementById('changePasswordForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const message = document.getElementById('message');
  message.className = 'alert alert-info mt-3 mb-0';
  message.textContent = '正在保存...';
  const response = await fetch('{{ url_for("change_own_password") }}', {method: 'POST', body: new FormData(this)});
  const data = await response.json();
  message.className = `alert ${data.status === 'success' ? 'alert-success' : 'alert-danger'} mt-3 mb-0`;
  message.textContent = data.msg || '操作失败';
  if (data.status === 'success') window.location.href = data.redirect || '/';
});
</script>
{% endblock %}
