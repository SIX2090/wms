{% extends "base.html" %}
{% block title %}新增物料{% endblock %}
{% block body_class %}wms-no-global-actionbar{% endblock %}

{% block content %}
<div class="page-header">
    <h2><i class="bi bi-plus-circle"></i> 新增物料</h2>
</div>

<div class="card">
    <div class="card-body">
        <form id="addMaterialForm" method="post" action="{{ url_for('add_material') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="row">
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-code-1">物料编码 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="code" required id="material-add-code-1">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-name-2">物料名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="name" required id="material-add-name-2">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-spec-3">规格型号</label>
                        <input type="text" class="form-control" name="spec" id="material-add-spec-3">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-brand-4">品牌</label>
                        <input type="text" class="form-control" name="brand" maxlength="100" placeholder="如 ABB、施耐德" id="material-add-brand-4">
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-category_id-5">分类</label>
                        <select class="form-select" name="category_id" id="material-add-category_id-5">
                            <option value="">请选择分类</option>
                            {% for category in categories %}
                            <option value="{{ category.id }}">{{ category.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label" for="unitSearch">单位</label>
                        <div class="input-group">
                            <div style="position:relative;flex:1;">
                                <input type="text" class="form-control" id="unitSearch" placeholder="输入单位名称搜索..." autocomplete="off">
                                <input type="hidden" name="unit_id" id="unitIdHidden">
                                <div id="unitDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:white;border:1px solid #d9d9d9;border-radius:4px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);margin-top:2px;"></div>
                            </div>
                            <button type="button" class="btn btn-outline-primary" id="addUnitButton" title="新增单位">
                                <i class="bi bi-plus"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label" for="supplierSearch">供应商</label>
                        <div style="position:relative;">
                            <input type="text" class="form-control" id="supplierSearch" placeholder="输入供应商名称搜索..." autocomplete="off">
                            <input type="hidden" name="supplier_id" id="supplierIdHidden">
                            <div id="supplierDropdown" style="display:none;position:absolute;top:100%;left:0;right:0;max-height:200px;overflow-y:auto;background:white;border:1px solid #d9d9d9;border-radius:4px;z-index:9999;box-shadow:0 2px 8px rgba(0,0,0,0.15);margin-top:2px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-md-4">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-stock-7">初始库存</label>
                        <input type="number" class="form-control" name="stock" value="0" min="0" step="0.01" id="material-add-stock-7">
                    </div>
                </div>
                {% if inventory_alert_enabled %}
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label" for="material-add-min_stock-8">最低库存</label>
                            <input type="number" class="form-control" name="min_stock" value="0" min="0" step="0.01" id="material-add-min_stock-8">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="mb-3">
                            <label class="form-label" for="material-add-safety_stock-9">安全库存</label>
                            <input type="number" class="form-control" name="safety_stock" value="0" min="0" step="0.01" id="material-add-safety_stock-9">
                        </div>
                    </div>
                {% endif %}
            </div>
            
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-price-10">参考单价</label>
                        <input type="number" class="form-control" name="price" value="0" min="0" step="0.01" id="material-add-price-10">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-3">
                        <label class="form-label" for="material-add-remark-11">备注</label>
                        <textarea class="form-control" name="remark" rows="2" id="material-add-remark-11"></textarea>
                    </div>
                </div>
            </div>
            
            <p id="materialSaveFeedback" data-save-feedback role="status" aria-live="polite" class="small text-muted">正在准备录入，如持续未就绪请刷新页面。</p>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary" id="materialSaveButton" data-wms-save disabled title="保存（Ctrl/Cmd+S）">
                    <i class="bi bi-save"></i> 保存
                </button>
                <a href="/material" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> 返回
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="application/json" id="material-add-data">{{ {'units': units, 'suppliers': suppliers}|tojson }}</script>
<script src="{{ url_for('static', filename='js/pages/material-add.js') }}?v={{ config.get('STATIC_VERSION', '1.0.0') }}"></script>
{% endblock %}
