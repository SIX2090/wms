{% extends "base.html" %}
{% block title %}我的资料{% endblock %}
{% block body_class %}embedded-page{% endblock %}
{% block content %}
<div class="container py-4" style="max-width: 640px">
  <div class="card shadow-sm">
    <div class="card-body p-4">
      <h4 class="mb-2">我的资料</h4>
      <p class="text-muted small mb-3">仅本人可修改以下资料；用户名、角色、状态、密码不受此页影响</p>
      <form id="myProfileForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">用户名</label>
          <input class="form-control" type="text" value="{{ profile_user.username }}" disabled>
          <div class="form-text">如需修改用户名请联系系统管理员</div>
        </div>
        <div class="mb-3">
          <label class="form-label">角色</label>
          <input class="form-control" type="text" value="{{ profile_user.role }}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">邮箱</label>
          <input class="form-control" type="email" name="email" value="{{ profile_user.email or '' }}" maxlength="200" placeholder="例如：user@example.com">
        </div>
        <div class="mb-3">
          <label class="form-label">电话</label>
          <input class="form-control" type="tel" name="phone" value="{{ profile_user.phone or '' }}" maxlength="30" placeholder="仅允许数字 / - / + / 空格">
        </div>
        <div class="mb-3">
          <label class="form-label">个人简介</label>
          <textarea class="form-control" name="bio" rows="3" maxlength="500" placeholder="最多 500 字符">{{ profile_user.bio or '' }}</textarea>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">保存资料</button>
          <a class="btn btn-outline-secondary" href="/user/change_password">修改密码</a>
        </div>
      </form>
      <div id="myProfileMsg" class="alert d-none mt-3 mb-0"></div>
    </div>
  </div>
</div>
<script>
document.getElementById('myProfileForm').addEventListener('submit', async function (event) {
  event.preventDefault();
  const msg = document.getElementById('myProfileMsg');
  msg.className = 'alert alert-info mt-3 mb-0';
  msg.textContent = '正在保存...';
  const resp = await fetch('{{ url_for("edit_my_profile") }}', {
    method: 'POST',
    body: new FormData(this),
    headers: { 'X-Requested-With': 'XMLHttpRequest' }
  });
  let data = {};
  try { data = await resp.json(); } catch (e) {
    msg.className = 'alert alert-danger mt-3 mb-0';
    msg.textContent = '保存失败：服务器返回 ' + resp.status;
    return;
  }
  if (resp.ok && data.status === 'success') {
    msg.className = 'alert alert-success mt-3 mb-0';
    msg.textContent = data.msg || '资料已更新';
  } else {
    msg.className = 'alert alert-danger mt-3 mb-0';
    msg.textContent = data.msg || ('HTTP ' + resp.status);
  }
});
</script>
{% endblock %}
