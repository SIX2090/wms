{% if report.pagination %}
<nav class="d-flex align-items-center gap-3 my-3" aria-label="分析明细分页">
    <span>共 {{ report.pagination.total }} 条，第 {{ report.pagination.page }} / {{ report.pagination.pages }} 页</span>
    {% if report.pagination.previous %}<a class="btn btn-outline-secondary btn-sm" href="{{ report.pagination.previous }}">上一页</a>{% endif %}
    {% if report.pagination.next %}<a class="btn btn-outline-secondary btn-sm" href="{{ report.pagination.next }}">下一页</a>{% endif %}
</nav>
{% endif %}
