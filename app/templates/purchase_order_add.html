{% extends "base.html" %}
{% block title %}{{ page_title or '新增采购订单' }}{% endblock %}
{% block extra_css %}
<style>
/* ==================== Changjet T+ 风格 - 采购订单 ==================== */
.page-header {
    background: #fff;
    padding: 12px 16px;
    border-bottom: 1px solid #D9D9D9;
    margin-bottom: 0;
}
.page-header h2 {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin: 0;
}
.card {
    border: none;
    border-radius: 0;
    box-shadow: none;
    margin-bottom: 0;
}
.card-body {
    padding: 10px 16px;
}
.form-label {
    font-size: 12px;
    color: #666;
    margin-bottom: 3px;
    font-weight: 400;
}
.form-control, .form-select {
    border: 1px solid #D9D9D9;
    border-radius: 2px;
    padding: 3px 8px;
    font-size: 12px;
    height: 28px;
    transition: border-color 0.15s;
    background: #fff;
}
.form-control:focus, .form-select:focus {
    border-color: #1890FF;
    box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
    outline: none;
}
.form-control[readonly] {
    background-color: #F5F5F5;
    color: #666;
}
textarea.form-control {
    height: auto;
    resize: vertical;
}

/* 物料/供应商搜索下拉组件 - 采购订单特有 */
.material-input-wrap { position: relative; display: flex; gap: 4px; }
.material-select-btn { flex: 0 0 28px; border: 1px solid #ced4da; background: #fff; border-radius: 4px; }
.material-dropdown {
    position: fixed; z-index: 1200; min-width: 360px; max-width: min(640px, calc(100vw - 24px));
    max-height: 280px; overflow-y: auto; background: #fff; border: 1px solid #d9e2ef;
    border-radius: 6px; box-shadow: 0 8px 24px rgba(15, 23, 42, .14);
}
.material-dropdown-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #f1f3f5; font-size: 13px; }
.material-dropdown-item:hover, .material-dropdown-item.active { background: #eef6ff; }
.material-dropdown-item .code { font-weight: 600; color: #0d6efd; }
.material-dropdown-item .meta { display: inline-block; margin-left: 8px; color: #6c757d; }
.supplier-input-wrap { position: relative; }
.supplier-dropdown {
    position: fixed; z-index: 1200; min-width: 280px; max-width: min(520px, calc(100vw - 24px));
    max-height: 260px; overflow-y: auto; background: #fff; border: 1px solid #d9e2ef;
    border-radius: 6px; box-shadow: 0 8px 24px rgba(15, 23, 42, .14);
}
.supplier-dropdown-item { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #f1f3f5; font-size: 13px; }
.supplier-dropdown-item:hover, .supplier-dropdown-item.active { background: #eef6ff; }
.supplier-dropdown-item .code { color: #6c757d; margin-left: 8px; }

/* ==================== T+ 网格线表格 ==================== */
.tplus-table-wrapper {
    border: 1px solid #D9D9D9;
    overflow: hidden;
    background: #fff;
    margin-top: 6px;
}
#materialTable {
    margin-bottom: 0 !important;
    border-collapse: collapse !important;
    width: 100% !important;
    table-layout: auto !important;
}
/* 表头 - T+ 风格 */
#materialTable thead th {
    background: #FAFAFA !important;
    color: #333 !important;
    font-weight: 500 !important;
    padding: 7px 8px !important;
    border: 1px solid #E8E8E8 !important;
    font-size: 12px !important;
    white-space: nowrap !important;
    text-align: center !important;
    height: 34px !important;
    line-height: 1.4 !important;
}
/* 表体单元格 - 全网格线 */
#materialTable tbody td {
    padding: 0 4px !important;
    vertical-align: middle !important;
    font-size: 12px !important;
    border: 1px solid #E8E8E8 !important;
    height: 30px !important;
    color: #333 !important;
    transition: background-color 0.1s !important;
}
/* 隔行变色 */
#materialTable tbody tr:nth-child(even) td {
    background-color: #FAFAFA !important;
}
#materialTable tbody tr:nth-child(odd) td {
    background-color: #fff !important;
}
/* 行悬停 */
#materialTable tbody tr:hover td {
    background-color: #E6F7FF !important;
    border-color: #91D5FF !important;
}
/* 当前活动行高亮 */
#materialTable tbody tr.row-active td {
    background-color: #BAE7FF !important;
    border-color: #69C0FF !important;
}
/* 序号列 */
#materialTable .row-num {
    width: 42px;
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 0 2px !important;
}
/* 操作列 */
#materialTable .action-col {
    width: 92px !important;
    min-width: 92px !important;
    text-align: center;
    white-space: nowrap;
}
#materialTable .action-col .btn {
    width: 26px;
    height: 22px;
    padding: 0 !important;
    display: inline-flex;
    align-items: center;
    justify-content: center;
}
/* 金额列 - 右对齐 */
#materialTable .amount-col {
    text-align: right;
    font-family: 'SF Mono', 'Consolas', 'Monaco', monospace;
    font-variant-numeric: tabular-nums;
    padding-right: 8px !important;
}
/* 数量/单价列 - 右对齐 */
#materialTable .num-col {
    text-align: right;
    padding-right: 6px !important;
}

/* 单元格内输入框 - T+ 无边框风格 */
#materialTable tbody td input.form-control,
#materialTable tbody td select.form-select {
    border: 1px solid transparent !important;
    background: transparent !important;
    padding: 2px 4px !important;
    height: 26px !important;
    font-size: 12px !important;
    width: 100% !important;
    border-radius: 2px !important;
    color: #333 !important;
    text-align: inherit !important;
}
#materialTable tbody td .num-col input.form-control,
#materialTable tbody td.num-col input.form-control {
    text-align: right !important;
}
#materialTable tbody td input.form-control:hover {
    border-color: #D9D9D9 !important;
    background: #FAFAFA !important;
}
#materialTable tbody td input.form-control:focus {
    background: #fff !important;
    border-color: #1890FF !important;
    box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1) !important;
    outline: none !important;
}
#materialTable tbody td input.form-control[readonly] {
    background: #fff !important;
    cursor: default !important;
    color: #333 !important;
    border-color: transparent !important;
}

/* 表脚 - 合计行 T+ 金色风格 */
#materialTable tfoot td {
    padding: 8px !important;
    font-size: 12px !important;
    border: 1px solid #E8E8E8 !important;
    font-weight: 600 !important;
    color: #333 !important;
    background: #FFFBE6 !important;
}
#materialTable .total-row td {
    background: #FFFBE6 !important;
    border-color: #FFE58F !important;
    border-top: 1px solid #FFE58F !important;
}
.total-amount {
    color: #F5222D;
    font-weight: 700;
    font-size: 13px;
}
/* 表脚空白单元格 */
#materialTable tfoot td.empty-foot {
    background: #FFFBE6 !important;
}

/* 底部按钮区 */
.footer-bar {
    background: #fff;
    padding: 12px 16px;
    border-top: 1px solid #D9D9D9;
    display: flex;
    justify-content: flex-end;
    gap: 8px;
}
/* 列宽拖拽 - T+ 风格 */
.col-resize {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    cursor: col-resize;
    user-select: none;
    z-index: 5;
}
.col-resize:hover,
.col-resize.active {
    background: #1890FF;
}
#materialTable th {
    position: relative;
}
/* 添加按钮区域 */
.tplus-toolbar {
    display: flex;
    gap: 6px;
    padding: 4px 0;
    align-items: center;
    flex-wrap: wrap;
}
.tplus-toolbar .btn,
.tplus-toolbar .form-select {
    height: 34px;
    border-radius: 5px;
    font-size: 12px;
    line-height: 1;
}
.tplus-toolbar .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 0 14px;
    font-weight: 500;
    box-shadow: none;
}
.tplus-toolbar .btn i {
    font-size: 13px;
}
.tplus-toolbar .form-select {
    width: auto;
    min-width: 150px;
    padding: 0 32px 0 10px;
}
.tplus-toolbar .btn-primary {
    background: #2563EB;
    border-color: #2563EB;
    color: #fff;
}
.tplus-toolbar .btn-outline-primary,
.tplus-toolbar .btn-outline-success,
.tplus-toolbar .btn-outline-info,
.tplus-toolbar .btn-outline-warning,
.tplus-toolbar .btn-outline-secondary,
.tplus-toolbar .btn-outline-dark {
    background: #fff;
    border-color: #CBD5E1;
    color: #1F2937;
}
.tplus-toolbar .btn-outline-primary:hover,
.tplus-toolbar .btn-outline-success:hover,
.tplus-toolbar .btn-outline-info:hover,
.tplus-toolbar .btn-outline-warning:hover,
.tplus-toolbar .btn-outline-secondary:hover,
.tplus-toolbar .btn-outline-dark:hover {
    background: #F1F5F9;
    border-color: #64748B;
    color: #111827;
}

@media (max-width: 768px) {
    .material-input-wrap {
        min-width: 150px;
    }

    .material-select-btn {
        flex-basis: 36px;
        min-height: 34px;
    }

    .material-dropdown,
    .supplier-dropdown {
        left: 8px !important;
        right: 8px !important;
        width: auto !important;
        min-width: 0 !important;
        max-width: calc(100vw - 16px) !important;
        max-height: min(320px, 55vh);
        z-index: 2300;
    }

    .material-dropdown-item,
    .supplier-dropdown-item {
        min-height: 44px;
        padding: 10px 12px;
        font-size: 14px;
    }

    .tplus-table-wrapper {
        overflow: auto;
        -webkit-overflow-scrolling: touch;
    }

    #materialTable {
        min-width: 1040px;
    }

    #materialTable thead th,
    #materialTable tbody td {
        height: 40px !important;
    }

    #materialTable tbody td input.form-control,
    #materialTable tbody td select.form-select {
        height: 34px !important;
        min-height: 34px !important;
        font-size: 14px !important;
    }

    .footer-bar {
        position: sticky;
        bottom: 0;
        z-index: 90;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px;
        margin: 8px -10px -10px;
        box-shadow: 0 -2px 10px rgba(15, 23, 42, .08);
    }

    .footer-bar .btn {
        width: 100%;
        min-height: 40px;
    }
}

/* 选择行的高亮 */
#materialTable tbody tr.selected td {
    background-color: #BAE7FF !important;
    border-color: #69C0FF !important;
}
</style>
{% endblock %}

{% block content %}
<div class="page-header d-flex justify-content-between align-items-center">
    <h2 class="mb-0"><i class="bi bi-bag-check"></i> {{ page_title or '新增采购订单' }}</h2>
    <div class="d-flex gap-2 flex-wrap">
        <button type="button" class="btn btn-outline-primary" onclick="submitForm(true)">
            <i class="bi bi-plus-square"></i> 保存并新建
        </button>
        <button type="button" class="btn btn-primary" onclick="submitForm(false)">
            <i class="bi bi-save"></i> 保存
        </button>
        <a href="/purchase_order" class="btn btn-secondary"><i class="bi bi-arrow-left"></i> 返回列表</a>
    </div>
</div>

<div class="card">
    <div class="card-body">
        <form id="purchaseOrderForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="order_id" value="{{ order_id or '' }}">
            <input type="hidden" name="order_no" value="{{ order_no }}">

            <div class="row mb-3">
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">采购单号</label>
                        <input type="text" class="form-control" value="{{ order_no }}" readonly>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">采购日期</label>
                        <input type="date" class="form-control" name="date" value="{{ order_date }}">
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">供应商</label>
                        <div class="supplier-input-wrap">
                            <input type="text" class="form-control" id="supplierName" name="supplier_name" value="{{ order.supplier.name if order and order.supplier else '' }}" placeholder="可选择或手工输入" autocomplete="off">
                            <input type="hidden" id="supplierId" name="supplier_id" value="{{ order.supplier_id if order and order.supplier_id else '' }}">
                            <div class="supplier-dropdown" id="supplierDropdown" style="display:none;"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="mb-2">
                        <label class="form-label">预计到货</label>
                        <input type="date" class="form-control" name="expected_date" value="{{ expected_date }}">
                    </div>
                </div>
                <div class="col-md-12">
                    <div class="mb-2">
                        <label class="form-label">备注</label>
                        <input type="text" class="form-control" name="remark" value="{{ order.remark if order else '' }}">
                    </div>
                </div>
            </div>

            <div class="tplus-toolbar mb-3">
                <button type="button" class="btn btn-primary" onclick="addNewRow()">
                    <i class="bi bi-plus"></i> 添加物料
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="copyPreviousRow()">
                    <i class="bi bi-copy"></i> 复制上一行
                </button>
            </div>

            <div class="tplus-table-wrapper">
                <table id="materialTable">
                    <thead>
                        <tr>
                            <th class="row-num">序号<span class="col-resize"></span></th>
                            <th style="width: 160px;">物料编码<span class="col-resize"></span></th>
                            <th>物料名称<span class="col-resize"></span></th>
                            <th style="width: 120px;">规格<span class="col-resize"></span></th>
                            <th style="width: 80px;">单位<span class="col-resize"></span></th>
                            <th style="width: 100px;" class="num-col">数量<span class="col-resize"></span></th>
                            <th style="width: 100px;" class="num-col">单价<span class="col-resize"></span></th>
                            <th style="width: 110px;" class="amount-col">金额<span class="col-resize"></span></th>
                            <th style="width: 140px;">合同编号<span class="col-resize"></span></th>
                            <th style="width: 180px;">工程名称<span class="col-resize"></span></th>
                            <th style="width: 140px;">备注<span class="col-resize"></span></th>
                            <th style="width: 90px;" class="action-col">操作<span class="col-resize"></span></th>
                        </tr>
                    </thead>
                    <tbody id="materialTableBody"></tbody>
                    <tfoot>
                        <tr class="total-row">
                            <td colspan="7" class="text-end"><strong>合计：</strong></td>
                            <td class="amount-col"><strong id="totalAmount" class="total-amount">¥0.00</strong></td>
                            <td></td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>

        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
const materials = {{ materials|tojson }};
const suppliers = {{ suppliers|tojson }};
let activeDropdown = null;
let activeSupplierDropdown = null;
const initialItems = [
{% if order %}
{% for item in order.items %}
    {
        material_id: {{ item.material_id }},
        material_code: {{ item.material.code|tojson if item.material else '""' }},
        material_name: {{ item.material.name|tojson if item.material else '""' }},
        spec: {{ item.material.spec|tojson if item.material else '""' }},
        unit_name: {{ item.material.unit.name|tojson if item.material and item.material.unit else '""' }},
        quantity: {{ item.quantity or 0 }},
        price: {{ item.price or 0 }},
        contract_no: {{ (item.contract_no or order.contract_no or '')|tojson }},
        project_name: {{ (item.project_name or order.project_name or '')|tojson }},
        remark: {{ (item.remark or '')|tojson }}
    }{{ "," if not loop.last else "" }}
{% endfor %}
{% endif %}
];

function getMaterialUnit(material) {
    if (!material || !material.unit) return '';
    return typeof material.unit === 'object' ? (material.unit.name || '') : material.unit;
}

function formatMoney(value) {
    const n = parseFloat(value) || 0;
    return '¥' + n.toFixed(2);
}

function escapeHtml(value) {
    return String(value || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function supplierSearchText(supplier) {
    return [supplier.name, supplier.code, supplier.contact, supplier.phone]
        .map(v => String(v || '').toLowerCase())
        .join(' ');
}

function findSupplierByName(name) {
    const normalized = String(name || '').trim().toLowerCase();
    if (!normalized) return null;
    return suppliers.find(s => String(s.name || '').toLowerCase() === normalized)
        || suppliers.find(s => String(s.code || '').toLowerCase() === normalized)
        || null;
}

function setSupplier(supplier) {
    const nameInput = document.getElementById('supplierName');
    const idInput = document.getElementById('supplierId');
    if (!nameInput || !idInput || !supplier) return;
    nameInput.value = supplier.name || supplier.code || '';
    idInput.value = supplier.id || '';
    hideSupplierDropdown();
}

function showSupplierDropdown(showAll = false) {
    const input = document.getElementById('supplierName');
    const idInput = document.getElementById('supplierId');
    const dropdown = document.getElementById('supplierDropdown');
    if (!input || !idInput || !dropdown) return;
    const keyword = input.value.trim().toLowerCase();
    const exact = findSupplierByName(input.value);
    idInput.value = exact ? exact.id : '';
    if (!showAll && !keyword) {
        hideSupplierDropdown();
        return;
    }
    const filtered = suppliers.filter(s => showAll || supplierSearchText(s).includes(keyword)).slice(0, 80);
    if (!filtered.length) {
        dropdown.innerHTML = '<div class="supplier-dropdown-item text-muted">无匹配供应商，保存时将自动新增</div>';
    } else {
        dropdown.innerHTML = filtered.map((s, index) => `
            <div class="supplier-dropdown-item ${index === 0 ? 'active' : ''}" data-id="${escapeHtml(s.id)}">
                <span>${escapeHtml(s.name || '')}</span>
                ${s.code ? `<span class="code">${escapeHtml(s.code)}</span>` : ''}
            </div>
        `).join('');
        dropdown.querySelectorAll('.supplier-dropdown-item[data-id]').forEach(item => {
            item.addEventListener('mousedown', function(event) {
                event.preventDefault();
                const supplier = suppliers.find(s => String(s.id) === String(this.dataset.id));
                setSupplier(supplier);
            });
        });
    }
    const rect = input.getBoundingClientRect();
    dropdown.style.top = (rect.bottom + 5) + 'px';
    dropdown.style.left = rect.left + 'px';
    dropdown.style.display = 'block';
    activeSupplierDropdown = dropdown;
}

function moveSupplierActive(delta) {
    const dropdown = document.getElementById('supplierDropdown');
    if (!dropdown || dropdown.style.display === 'none') return;
    const items = Array.from(dropdown.querySelectorAll('.supplier-dropdown-item[data-id]'));
    if (!items.length) return;
    const current = Math.max(0, items.findIndex(item => item.classList.contains('active')));
    const next = (current + delta + items.length) % items.length;
    items[current]?.classList.remove('active');
    items[next].classList.add('active');
    items[next].scrollIntoView({block: 'nearest'});
}

function hideSupplierDropdown() {
    if (activeSupplierDropdown) {
        activeSupplierDropdown.style.display = 'none';
        activeSupplierDropdown = null;
    }
}

function setupSupplierInput() {
    const input = document.getElementById('supplierName');
    const idInput = document.getElementById('supplierId');
    if (!input || !idInput) return;
    input.addEventListener('input', function() {
        showSupplierDropdown();
    });
    input.addEventListener('focus', function() {
        showSupplierDropdown(true);
    });
    input.addEventListener('keydown', function(event) {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            moveSupplierActive(event.key === 'ArrowDown' ? 1 : -1);
            return;
        }
        if (event.key === 'Escape') {
            hideSupplierDropdown();
            return;
        }
        if (event.key === 'Enter') {
            const active = document.querySelector('#supplierDropdown .supplier-dropdown-item.active[data-id]');
            if (active) {
                event.preventDefault();
                const supplier = suppliers.find(s => String(s.id) === String(active.dataset.id));
                setSupplier(supplier);
            }
        }
    });
    input.addEventListener('blur', function() {
        const supplier = findSupplierByName(input.value);
        idInput.value = supplier ? supplier.id : '';
    });
}

function materialSearchText(material) {
    return [material.code, material.name, material.spec, getMaterialUnit(material)]
        .map(v => String(v || '').toLowerCase())
        .join(' ');
}

function findMaterial(code) {
    const normalized = String(code || '').trim().toLowerCase();
    if (!normalized) return null;
    return materials.find(m => String(m.code || '').toLowerCase() === normalized)
        || materials.find(m => String(m.name || '').toLowerCase() === normalized)
        || null;
}

function findMaterialByKeyword(keyword) {
    const normalized = String(keyword || '').trim().toLowerCase();
    if (!normalized) return null;
    return findMaterial(normalized)
        || materials.find(m => materialSearchText(m).includes(normalized))
        || null;
}

function addNewRow(data = {}, insertBeforeRow = null) {
    const tbody = document.getElementById('materialTableBody');
    const row = document.createElement('tr');
    row.innerHTML = `
        <td class="row-num"></td>
        <td>
            <div class="material-input-wrap">
                <input class="form-control material-code" value="${escapeHtml(data.material_code || '')}" autocomplete="off">
                <button type="button" class="material-select-btn" title="选择物料">▼</button>
                <div class="material-dropdown" style="display:none;"></div>
            </div>
        </td>
        <td><input class="form-control material-name" value="${escapeHtml(data.material_name || '')}" readonly></td>
        <td><input class="form-control material-spec" value="${escapeHtml(data.spec || '')}" readonly></td>
        <td><input class="form-control material-unit" value="${escapeHtml(data.unit_name || '')}" readonly></td>
        <td class="num-col"><input type="number" class="form-control material-qty" min="0" step="0.01" value="${escapeHtml(data.quantity || '')}"></td>
        <td class="num-col"><input type="number" class="form-control material-price" min="0" step="0.01" value="${escapeHtml(data.price || '')}"></td>
        <td class="amount-col"><input class="form-control material-amount" readonly></td>
        <td><input class="form-control line-contract-no" maxlength="50" value="${escapeHtml(data.contract_no || '')}"></td>
        <td><input class="form-control line-project-name" maxlength="200" value="${escapeHtml(data.project_name || '')}"></td>
        <td><input type="text" class="form-control material-remark" maxlength="500" value="${escapeHtml(data.remark || '')}"></td>
        <td class="action-col">
            <button type="button" class="btn btn-sm btn-outline-primary me-1" onclick="insertRowBefore(this)" title="插入"><i class="bi bi-plus-circle"></i></button>
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteRow(this)" title="删除"><i class="bi bi-trash"></i></button>
        </td>
    `;
    if (insertBeforeRow) {
        tbody.insertBefore(row, insertBeforeRow);
    } else {
        tbody.appendChild(row);
    }
    bindRow(row);
    if (window.WMS && window.WMS.ContractAutocomplete) {
        window.WMS.ContractAutocomplete.bindRow(row);
    }
    if (data.material_id) {
        row.querySelector('.material-code').dataset.materialId = data.material_id;
    }
    calcAmount(row);
    renumberRows();
    return row;
}

function bindRow(row) {
    const codeInput = row.querySelector('.material-code');
    codeInput.addEventListener('input', function() {
        const material = findMaterial(this.value);
        if (material) fillMaterial(row, material);
        else clearMaterial(row);
        showMaterialDropdown(row);
    });
    codeInput.addEventListener('keydown', function(event) {
        const dropdown = row.querySelector('.material-dropdown');
        const active = dropdown.querySelector('.material-dropdown-item.active');
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault();
            moveDropdownActive(dropdown, event.key === 'ArrowDown' ? 1 : -1);
            return;
        }
        if (event.key === 'Escape') {
            hideMaterialDropdown();
            return;
        }
        if (event.key === 'Enter') {
            event.preventDefault();
            if (active) {
                selectMaterial(row, active.dataset.code);
                return;
            }
            const material = findMaterialByKeyword(this.value);
            if (material) fillMaterial(row, material);
            hideMaterialDropdown();
            row.querySelector('.material-qty').focus();
            row.querySelector('.material-qty').select();
        }
    });
    codeInput.addEventListener('focus', function() {
        if (this.value.trim()) showMaterialDropdown(row);
    });
    row.querySelector('.material-select-btn').addEventListener('click', function() {
        showMaterialDropdown(row, true);
    });
    row.querySelector('.material-qty').addEventListener('input', () => calcAmount(row));
    row.querySelector('.material-price').addEventListener('input', () => calcAmount(row));
    row.querySelector('.material-qty').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            row.querySelector('.material-price').focus();
            row.querySelector('.material-price').select();
        }
    });
    row.querySelector('.material-price').addEventListener('keydown', function(event) {
        if (event.key === 'Enter') {
            event.preventDefault();
            let next = row.nextElementSibling;
            if (!next) next = addNewRow();
            next.querySelector('.material-code').focus();
        }
    });
}

function showMaterialDropdown(row, showAll = false) {
    const input = row.querySelector('.material-code');
    const dropdown = row.querySelector('.material-dropdown');
    const keyword = input.value.trim().toLowerCase();
    if (!showAll && !keyword) {
        dropdown.style.display = 'none';
        return;
    }
    if (activeDropdown && activeDropdown !== dropdown) {
        activeDropdown.style.display = 'none';
    }
    const filtered = materials.filter(m => showAll || materialSearchText(m).includes(keyword)).slice(0, 80);
    if (!filtered.length) {
        dropdown.innerHTML = '<div class="material-dropdown-item text-muted">无匹配物料</div>';
    } else {
        dropdown.innerHTML = filtered.map((m, index) => `
            <div class="material-dropdown-item ${index === 0 ? 'active' : ''}" data-code="${escapeHtml(m.code)}">
                <span class="code">${escapeHtml(m.code)}</span>
                <span>${escapeHtml(m.name)}</span>
                <span class="meta">${escapeHtml(m.spec || '')}</span>
                <span class="meta">${escapeHtml(getMaterialUnit(m))}</span>
            </div>
        `).join('');
        dropdown.querySelectorAll('.material-dropdown-item[data-code]').forEach(item => {
            item.addEventListener('mousedown', function(event) {
                event.preventDefault();
                selectMaterial(row, this.dataset.code);
            });
        });
    }
    const rect = input.getBoundingClientRect();
    dropdown.style.top = (rect.bottom + 5) + 'px';
    dropdown.style.left = rect.left + 'px';
    dropdown.style.display = 'block';
    activeDropdown = dropdown;
}

function moveDropdownActive(dropdown, delta) {
    const items = Array.from(dropdown.querySelectorAll('.material-dropdown-item[data-code]'));
    if (!items.length) return;
    const current = Math.max(0, items.findIndex(item => item.classList.contains('active')));
    const next = (current + delta + items.length) % items.length;
    items[current]?.classList.remove('active');
    items[next].classList.add('active');
    items[next].scrollIntoView({block: 'nearest'});
}

function hideMaterialDropdown() {
    if (activeDropdown) {
        activeDropdown.style.display = 'none';
        activeDropdown = null;
    }
}

function selectMaterial(row, code) {
    const material = findMaterial(code);
    if (!material) return;
    fillMaterial(row, material);
    hideMaterialDropdown();
    row.querySelector('.material-qty').focus();
    row.querySelector('.material-qty').select();
}

function fillMaterial(row, material) {
    row.querySelector('.material-code').dataset.materialId = material.id || '';
    row.querySelector('.material-name').value = material.name || '';
    row.querySelector('.material-spec').value = material.spec || '';
    row.querySelector('.material-unit').value = getMaterialUnit(material);
    const price = row.querySelector('.material-price');
    if (!price.value) price.value = material.price || '';
    calcAmount(row);
}

function clearMaterial(row) {
    row.querySelector('.material-code').dataset.materialId = '';
    row.querySelector('.material-name').value = '';
    row.querySelector('.material-spec').value = '';
    row.querySelector('.material-unit').value = '';
    calcAmount(row);
}

function calcAmount(row) {
    const qty = parseFloat(row.querySelector('.material-qty').value) || 0;
    const price = parseFloat(row.querySelector('.material-price').value) || 0;
    row.querySelector('.material-amount').value = qty || price ? (qty * price).toFixed(2) : '';
    calcTotal();
}

function calcTotal() {
    let total = 0;
    document.querySelectorAll('#materialTableBody tr').forEach(row => {
        total += parseFloat(row.querySelector('.material-amount').value) || 0;
    });
    document.getElementById('totalAmount').textContent = formatMoney(total);
}

function renumberRows() {
    document.querySelectorAll('#materialTableBody tr').forEach((row, index) => {
        row.querySelector('.row-num').textContent = index + 1;
    });
}

function deleteRow(btn) {
    btn.closest('tr').remove();
    renumberRows();
    calcTotal();
}

function rowData(row) {
    return {
        material_id: row.querySelector('.material-code').dataset.materialId,
        material_code: row.querySelector('.material-code').value,
        material_name: row.querySelector('.material-name').value,
        spec: row.querySelector('.material-spec').value,
        unit_name: row.querySelector('.material-unit').value,
        quantity: row.querySelector('.material-qty').value,
        price: row.querySelector('.material-price').value,
        remark: row.querySelector('.material-remark')?.value || ''
    };
}

function insertRowBefore(btn) {
    const row = addNewRow({}, btn.closest('tr'));
    row.querySelector('.material-code').focus();
    return row;
}

function copyPreviousRow() {
    const rows = Array.from(document.querySelectorAll('#materialTableBody tr'));
    const source = rows.reverse().find(row => row.querySelector('.material-code').value.trim());
    if (!source) {
        addNewRow();
        return;
    }
    const row = addNewRow(rowData(source));
    row.querySelector('.material-qty').focus();
    row.querySelector('.material-qty').select();
}

function copyRowAfter(row) {
    if (!row) {
        copyPreviousRow();
        return;
    }
    const target = addNewRow(rowData(row), row.nextElementSibling);
    target.querySelector('.material-qty').focus();
    target.querySelector('.material-qty').select();
}

function collectItems() {
    return Array.from(document.querySelectorAll('#materialTableBody tr')).map(row => ({
        material_id: row.querySelector('.material-code').dataset.materialId || (findMaterialByKeyword(row.querySelector('.material-code').value)?.id || null),
        material_code: findMaterialByKeyword(row.querySelector('.material-code').value)?.code || row.querySelector('.material-code').value.trim(),
        quantity: row.querySelector('.material-qty').value,
        price: row.querySelector('.material-price').value,
        contract_no: (row.querySelector('.line-contract-no')?.value || '').trim(),
        project_name: (row.querySelector('.line-project-name')?.value || '').trim(),
        remark: (row.querySelector('.material-remark')?.value || '').trim()
    })).filter(item => item.material_id || item.material_code);
}

function submitForm(saveAndNew) {
    window.__saveAndNew = !!saveAndNew;
    const form = document.getElementById('purchaseOrderForm');
    const formData = new FormData(form);
    const payload = {
        order_id: formData.get('order_id') || null,
        order_no: formData.get('order_no'),
        date: formData.get('date'),
        supplier_id: formData.get('supplier_id'),
        supplier_name: formData.get('supplier_name'),
        expected_date: formData.get('expected_date'),
        remark: formData.get('remark'),
        items: collectItems()
    };
    if (!payload.date) {
        showToast('请选择采购日期', 'warning');
        return;
    }
    if (!payload.items.length) {
        showToast('请至少添加一条采购明细', 'warning');
        return;
    }
    fetch('/purchase_order/save', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            showToast('采购单保存成功', 'success');
            // BUG-2026-07-28-014 修复：保存并新建 - 保留表头回到新增页
            if (window.__saveAndNew) {
                setTimeout(() => {
                    const url = new URL(window.location.origin + '/purchase_order/add');
                    if (payload.supplier_id) url.searchParams.set('supplier_id', payload.supplier_id);
                    window.location.href = url.toString();
                }, 400);
            } else {
                setTimeout(() => window.location.href = '/purchase_order/' + data.id, 500);
            }
        } else {
            showToast(data.msg || '保存失败', 'danger', 3600);
        }
    })
    .catch(error => showToast('保存失败：' + error.message, 'danger', 3600));
}

document.addEventListener('DOMContentLoaded', function() {
    setupSupplierInput();
    if (initialItems.length) {
        initialItems.forEach(item => addNewRow(item));
    } else {
        // 无初始数据时默认预置 15 行空白明细行，便于直接录入。
        const DEFAULT_BLANK_ROWS = 15;
        for (let i = 0; i < DEFAULT_BLANK_ROWS; i++) {
            addNewRow();
        }
    }
    if (window.WMS && window.WMS.ContractAutocomplete) {
        window.WMS.ContractAutocomplete.bindAll();
    }
    registerDetailRowActions({
        tableSelector: '#materialTable',
        rowSelector: '#materialTableBody tr',
        add: function() {
            const row = addNewRow();
            row.querySelector('.material-code').focus();
        },
        insert: function(row) { insertRowBefore(row); },
        copy: function(row) { copyRowAfter(row); },
        remove: function(row) { deleteRow(row); }
    });
});
document.addEventListener('click', function(event) {
    if (!event.target.closest('.material-input-wrap')) hideMaterialDropdown();
    if (!event.target.closest('.supplier-input-wrap')) hideSupplierDropdown();
});
</script>

<script>
// ==================== 合同搜索 + 工程名称向下填充 ====================
(function() {
    const contracts = [];
    let activeIdx = -1;
    const searchInput = document.getElementById('contractSearch');
    const dropdown = document.getElementById('contractDropdown');
    const idHidden = document.getElementById('contractIdHidden');
    const projectNameInput = document.getElementById('projectNameInput');
    if (!searchInput || !dropdown) return;

    function esc(s) {
        if (s === null || s === undefined) return '';
        return String(s).replace(/[&<>"']/g, function(ch) {
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
        });
    }

    function render(list) {
        if (!list.length) { dropdown.style.display = 'none'; return; }
        dropdown.innerHTML = list.map(function(c, i) {
            return '<div class="contract-item" data-idx="' + i + '" data-id="' + esc(c.id) + '" ' +
                'style="padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0f0f0;font-size:13px;">' +
                '<span style="font-weight:bold;color:#0052cc;">' + esc(c.contract_no) + '</span>' +
                ' <span style="color:#666;">— ' + esc(c.project_name) + '</span>' +
                '</div>';
        }).join('');
        dropdown.style.display = 'block';
        activeIdx = -1;
        dropdown.querySelectorAll('.contract-item').forEach(function(item) {
            item.addEventListener('click', function() {
                const idx = parseInt(this.dataset.idx);
                const c = list[idx];
                searchInput.value = c.contract_no || '';
                idHidden.value = c.id || '';
                if (projectNameInput) projectNameInput.value = c.project_name || '';
                dropdown.style.display = 'none';
            });
            item.addEventListener('mouseenter', function() {
                dropdown.querySelectorAll('.contract-item').forEach(function(el) { el.style.backgroundColor = ''; });
                this.style.backgroundColor = '#e6f7ff';
                activeIdx = parseInt(this.dataset.idx);
            });
        });
    }

    function filterContracts(keyword) {
        const kw = keyword.toLowerCase();
        return contracts.filter(function(c) {
            return (c.contract_no || '').toLowerCase().indexOf(kw) !== -1 ||
                   (c.project_name || '').toLowerCase().indexOf(kw) !== -1;
        });
    }

    searchInput.addEventListener('input', function() {
        const kw = this.value.trim();
        idHidden.value = '';
        if (!kw) { dropdown.style.display = 'none'; return; }
        render(filterContracts(kw));
    });

    searchInput.addEventListener('focus', function() {
        if (this.value.trim()) {
            this.dispatchEvent(new Event('input'));
        } else {
            render(contracts);
        }
    });

    searchInput.addEventListener('keydown', function(e) {
        const items = dropdown.querySelectorAll('.contract-item');
        if (!items.length) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            activeIdx = Math.min(activeIdx + 1, items.length - 1);
            items.forEach(function(el, i) { el.style.backgroundColor = i === activeIdx ? '#e6f7ff' : ''; });
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            activeIdx = Math.max(activeIdx - 1, 0);
            items.forEach(function(el, i) { el.style.backgroundColor = i === activeIdx ? '#e6f7ff' : ''; });
        } else if (e.key === 'Enter') {
            e.preventDefault();
            if (activeIdx >= 0 && items[activeIdx]) items[activeIdx].click();
        } else if (e.key === 'Escape') {
            dropdown.style.display = 'none';
        }
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.contract-input')) dropdown.style.display = 'none';
    });

    fetch('/api/contracts').then(function(r) { return r.json(); }).then(function(list) {
        var arr = (list && list.data && list.data.contracts) ? list.data.contracts : (list && list.contracts) ? list.contracts : (Array.isArray(list) ? list : []);
        arr.forEach(function(c) { contracts.push(c); });
    }).catch(function(err) { console.warn('合同列表加载失败:', err); });
})();
</script>
