{% extends "base.html" %}
{% block title %}新建销售订单{% endblock %}
{% block content %}
<div class="container-fluid py-3"><div class="d-flex justify-content-between align-items-center mb-3"><h4>新建销售订单</h4><a href="{{ url_for('sales_order_list') }}" class="btn btn-outline-secondary">返回列表</a></div><form id="salesForm" class="card card-body"><div class="row g-3 mb-3"><div class="col-md-3"><label class="form-label">订单号</label><input class="form-control" name="order_no" value="{{ order_no }}" required></div><div class="col-md-2"><label class="form-label">订单日期</label><input class="form-control" type="date" name="date" value="{{ order_date }}" required></div><div class="col-md-3"><label class="form-label">客户</label><select class="form-select" name="customer_id" required><option value="">请选择客户</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.code }} - {{ customer.name }}</option>{% endfor %}</select></div><div class="col-md-2"><label class="form-label">交货日期</label><input class="form-control" type="date" name="delivery_date"></div><div class="col-md-2"><label class="form-label">发货仓库</label><select class="form-select" name="warehouse"><option value="">请选择</option>{% for warehouse in warehouses %}<option>{{ warehouse.name }}</option>{% endfor %}</select></div></div><div class="table-responsive"><table class="table table-bordered" id="items"><thead><tr><th style="width:24%">物料</th><th>规格</th><th>单位</th><th style="width:110px">数量</th><th style="width:130px">含税单价</th><th>备注</th><th style="width:60px"></th></tr></thead><tbody></tbody></table></div><button type="button" class="btn btn-outline-primary mb-3" onclick="addRow()"><i class="bi bi-plus"></i> 添加明细</button><div class="row"><div class="col-md-8"><label class="form-label">备注</label><textarea class="form-control" name="remark" rows="2"></textarea></div><div class="col-md-4 text-end align-self-end"><strong>含税金额：<span id="total">0.00</span></strong><button class="btn btn-primary ms-3">保存草稿</button></div></div></form></div>
<script>const materials={{ materials|tojson }};function addRow(){const tr=document.createElement('tr');tr.innerHTML='<td><select class="form-select material"><option value="">请选择物料</option>'+materials.map(m=>`<option value="${m.code}">${m.code} - ${m.name}</option>`).join('')+'</select></td><td class="spec"></td><td class="unit"></td><td><input class="form-control qty" type="number" min="0.01" step="0.01" value="1"></td><td><input class="form-control price" type="number" min="0" step="0.01" value="0"></td><td><input class="form-control remark"></td><td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest(\'tr\').remove();calc()">删除</button></td>';document.querySelector('#items tbody').appendChild(tr);tr.querySelector('.material').onchange=()=>{const m=materials.find(x=>x.code===tr.querySelector('.material').value);tr.querySelector('.spec').textContent=m?.spec||'-';tr.querySelector('.unit').textContent=m?.unit||'-';tr.querySelector('.price').value=m?.price||0;calc()};tr.querySelector('.qty').oninput=calc;tr.querySelector('.price').oninput=calc}function calc(){let total=0;document.querySelectorAll('#items tbody tr').forEach(tr=>total+=(+tr.querySelector('.qty').value||0)*(+tr.querySelector('.price').value||0));document.querySelector('#total').textContent=total.toFixed(2)}addRow();document.querySelector('#salesForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const items=[...document.querySelectorAll('#items tbody tr')].map(tr=>({code:tr.querySelector('.material').value,quantity:tr.querySelector('.qty').value,price:tr.querySelector('.price').value,remark:tr.querySelector('.remark').value}));const r=await fetch('{{ url_for("sales_order_add") }}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign(Object.fromEntries(f.entries()),{items}))});const d=await r.json();if(d.status==='success')location.href='/sales/'+d.id;else alert(d.msg||'保存失败')}</script>
{% endblock %}
