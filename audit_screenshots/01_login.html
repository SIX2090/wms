    <link href="/static/cdn/bootstrap-5.3.0.min.css" rel="stylesheet">

    <style>
        :root {
            --login-accent: #ff4d5f;
            --login-accent-dark: #e73348;
            --login-ink: #111827;
            --login-muted: #6b7280;
        }
        * {
            box-sizing: border-box;
        }
        html,
        body {
            min-height: 100%;
            margin: 0;
        }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
            color: var(--login-ink);
            overflow: hidden;
        }
        /* 科技粒子背景 - Canvas */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: -4;
            background: linear-gradient(135deg, #0c1929 0%, #1a3a5c 50%, #0f2847 100%);
        }
        @keyframes fluidMove1 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(100px, 120px) rotate(90deg) scale(1.1); }
            100% { transform: translate(60px, 80px) rotate(180deg) scale(0.95); }
        }
        @keyframes fluidMove2 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(-80px, -60px) rotate(-120deg) scale(1.15); }
            100% { transform: translate(-40px, -100px) rotate(-240deg) scale(0.9); }
        }
        @keyframes fluidMove3 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(120px, -80px) rotate(60deg) scale(1.1); }
            100% { transform: translate(80px, 60px) rotate(120deg) scale(1.05); }
        }
        @keyframes fluidMove4 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(-100px, 80px) rotate(-180deg) scale(0.95); }
            100% { transform: translate(-60px, -40px) rotate(-360deg) scale(1.1); }
        }
        @keyframes fluidMove5 {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); }
            50% { transform: translate(40px, 100px) rotate(150deg) scale(1.08); }
            100% { transform: translate(-80px, 60px) rotate(300deg) scale(0.92); }
        }
        .login-page {
            position: relative;
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(420px, 1fr) minmax(360px, 520px);
            align-items: center;
            gap: 56px;
            padding: 38px clamp(32px, 7vw, 130px);
            isolation: isolate;
        }
        .login-page::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(7, 14, 30, 0.35);
            z-index: -3;
        }
        .login-page::after {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 15%, rgba(255,255,255,0.16), transparent 24%),
                linear-gradient(180deg, rgba(255,255,255,0.12), rgba(255,255,255,0.02));
            z-index: -2;
        }
        .scene-motion {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }
        .scene-motion span {
            position: absolute;
            left: -220px;
            width: 220px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.72), transparent);
            animation: driftLine 9s linear infinite;
            opacity: 0.48;
        }
        .scene-motion span:nth-child(1) { top: 18%; animation-delay: -1s; }
        .scene-motion span:nth-child(2) { top: 38%; animation-delay: -4s; width: 300px; }
        .scene-motion span:nth-child(3) { top: 72%; animation-delay: -6s; width: 260px; }
        @keyframes driftLine {
            from { transform: translateX(0); }
            to { transform: translateX(calc(100vw + 320px)); }
        }
        .brand-panel {
            color: #fff;
            max-width: 760px;
            padding-top: 7vh;
        }
        .brand-kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.32);
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .brand-title {
            font-size: clamp(42px, 5vw, 74px);
            line-height: 1.08;
            font-weight: 700;

        .brand-subtitle {

            gap: 28px;
            flex-wrap: wrap;

            text-shadow: 0 8px 24px rgba(0,0,0,0.35);

        .brand-footer {
            position: absolute;

        .login-card {

        .login-card-header {

            justify-content: space-between;
            align-items: center;
            gap: 16px;
            border-bottom: 1px solid #eef2f7;

        .login-logo {

            gap: 10px;

            font-weight: 700;

        .login-logo-mark {

            border-radius: 12px;

            color: #fff;
            background: linear-gradient(135deg, #ff4d5f, #7c3aed);

        .login-mode {

            align-items: center;

            color: #ef4444;
            font-size: 13px;
            font-weight: 600;

        .login-body {

        .login-tabs {

        .login-tabs button {

        .login-tabs .active::after {

        .login-field {

        .login-field i {

        }
        .login-field input {

        .btn-login {

            box-shadow: 0 16px 32px rgba(255, 77, 95, 0.32);

            color: #fff;

        .login-links {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 18px;
            font-size: 13px;
        }
        .login-links a {
            color: #2563eb;
            text-decoration: none;
        }
        .login-links a:hover {
            text-decoration: underline;
        }
        .login-tools {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            border-top: 1px solid #eef2f7;
            margin-top: 24px;
            padding-top: 18px;
            color: #6b7280;
            font-size: 12px;
            text-align: center;
        }
        .login-tools i {
            display: block;
            font-size: 22px;
            color: #64748b;
            margin-bottom: 4px;
        }
        .alert {
            border-radius: 10px;
            font-size: 14px;
        }
        @media (max-width: 980px) {

                overflow: auto;

                left: 20px;

            }
        }
        @media (max-width: 560px) {
            body {
                min-height: 100%;
            }
            #particles-canvas {
                min-height: 100vh;
            }
            .login-page {
                min-height: 100vh;
                align-content: center;
                gap: 18px;
                padding: 20px 14px 24px;
            }
            .brand-panel {
                max-width: none;
                padding: 0 4px;
            }
            .brand-kicker {
                margin-bottom: 12px;
                padding: 6px 10px;
                font-size: 12px;
            }
            .brand-title {
                font-size: 28px;
                line-height: 1.16;
            }
            .brand-subtitle {
                margin-top: 12px;
                font-size: 15px;

            }
            .login-card {
                width: 100%;
                border-radius: 12px;
            }
            .login-card-header,
            .login-body {
                padding-left: 18px;

            }
            .login-card-header {
                padding-top: 18px;

            }
            .login-logo {

            }
            .login-logo-mark {
                width: 32px;

            .login-mode {

            .login-body {

            .login-field {

            .brand-footer {
                position: static;
                justify-content: center;
                gap: 10px;
                font-size: 12px;
                padding: 0 8px;
            }
        }
    </style>

<body>
    <!-- 科技粒子背景 -->

    <main class="login-page">

    <script>
        document.querySelectorAll('[data-login-mode]').forEach(function (tab) {
            tab.addEventListener('click', function () {
                document.querySelectorAll('[data-login-mode]').forEach(function (item) {
                    item.classList.toggle('active', item === tab);
                    item.setAttribute('aria-selected', item === tab ? 'true' : 'false');
                });
                document.getElementById('loginMode').value = tab.dataset.loginMode;
                document.querySelector('input[name="username"]').focus();
            });
        });

        // 科技粒子动画
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let mouse = {
            x: null,
            y: null,
            radius: 150
        };
        
        // 初始化画布大小
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        
        // 鼠标移动监听
        window.addEventListener('mousemove', (event) => {
            mouse.x = event.x;
            mouse.y = event.y;
        });
        
        // 粒子类
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = `rgba(${Math.random() * 50 + 100}, ${Math.random() * 100 + 150}, ${Math.random() * 150 + 200}, ${Math.random() * 0.5 + 0.3})`;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
            
            update() {
                // 鼠标交互
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;
                    
                    this.x -= directionX;
                    this.y -= directionY;
                }
                
                // 自动移动
                this.x += this.speedX;
                this.y += this.speedY;
                
                // 边界检测
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
                if (this.y < 0) this.y = canvas.height;
                if (this.y > canvas.height) this.y = 0;
                
                this.draw();
            }
        }
        
        // 初始化粒子
        function init() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000;
            for (let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }
        init();
        
        // 连接粒子
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = Math.sqrt(
                        Math.pow(particles[a].x - particles[b].x, 2) + 
                        Math.pow(particles[a].y - particles[b].y, 2)
                    );
                    
                    if (distance < 120) {
                        opacityValue = 1 - (distance / 120);
                        ctx.strokeStyle = `rgba(100, 180, 255, ${opacityValue * 0.3})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }
        
        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
